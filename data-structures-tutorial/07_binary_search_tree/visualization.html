<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二叉搜索树 - 交互演示</title>
    <link rel="stylesheet" href="../shared/style.css">
    <style>
        .vis-container {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
        }

        .vis-panel {
            flex: 1;
            min-width: 320px;
        }

        .tree-visual {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            min-height: 320px;
        }

        .tree-level {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 16px;
        }

        .tree-node {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tree-node-box {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--color-idle);
            border-radius: 50%;
            font-family: var(--font-mono);
            font-size: 1.2rem;
            font-weight: 700;
            background: white;
            transition: all 0.3s;
        }

        .tree-node-box.active {
            border-color: var(--color-active);
            background: #ffebee;
            color: var(--color-active);
            transform: scale(1.15);
            box-shadow: 0 0 16px rgba(229, 57, 53, 0.5);
        }

        .tree-node-box.visited {
            border-color: var(--color-done);
            background: #e8f5e9;
            color: #2e7d32;
        }

        .tree-node-box.current {
            border-color: var(--color-primary);
            background: #e3f2fd;
            color: #1976d2;
            transform: scale(1.1);
        }

        .tree-node-box.found {
            border-color: var(--color-success);
            background: #e8f5e9;
            color: #2e7d32;
            transform: scale(1.2);
            box-shadow: 0 0 16px rgba(76, 175, 80, 0.5);
        }

        .tree-node-box.notfound {
            border-color: var(--color-warning);
            background: #fff3e0;
            color: #e65100;
        }

        .tree-edge {
            width: 2px;
            height: 16px;
            background: #ccc;
            margin: 4px 0;
        }

        .node-label {
            font-size: 0.7rem;
            color: #666;
            margin-top: 4px;
        }

        .result-display {
            font-family: var(--font-mono);
            font-size: 1rem;
            background: #1d1d1f;
            color: #f5f5f7;
            padding: 14px 16px;
            border-radius: 8px;
            margin-top: 16px;
            min-height: 48px;
        }

        .result-display .value {
            color: #4ade80;
        }

        .info-box {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 12px;
        }

        .info-box h4 {
            font-size: 0.85rem;
            color: #6e6e73;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .highlight-box {
            background: #fff3cd;
            border-left: 4px solid var(--color-warning);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin-top: 12px;
        }

        .highlight-box h4 {
            font-size: 0.85rem;
            color: #856404;
            margin-bottom: 6px;
        }

        .highlight-box p {
            font-size: 0.95rem;
            color: #856404;
        }

        .next-box {
            background: #e3f2fd;
            border-left: 4px solid var(--color-primary);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin-top: 8px;
        }

        .next-box h4 {
            font-size: 0.85rem;
            color: #0d47a1;
            margin-bottom: 6px;
        }

        .next-box p {
            font-size: 0.95rem;
            color: #0d47a1;
        }

        .op-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .op-tab {
            padding: 10px 18px;
            border: 2px solid var(--color-border);
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: var(--font-main);
            transition: all 0.2s;
        }

        .op-tab:hover {
            border-color: var(--color-primary);
            background: #e3f2fd;
        }

        .op-tab.active {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: white;
        }

        .control-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .control-label {
            font-size: 0.9rem;
            color: var(--color-text-muted);
        }

        .input-field {
            padding: 10px 14px;
            border: 2px solid var(--color-border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: var(--font-main);
            width: 80px;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--color-primary);
        }

        .tree-invis {
            width: 50px;
            height: 50px;
        }

        .null-node {
            width: 50px;
            height: 50px;
            border: 2px dashed #ccc;
            border-radius: 50%;
            opacity: 0.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="vis-header">
            <h1>二叉搜索树 - 交互演示</h1>
            <p class="subtitle">BST 插入、查找、删除 | 三种遍历方式</p>
        </header>

        <main class="vis-main">
            <div class="vis-container">
                <div class="vis-panel">
                    <div class="op-tabs" id="opTabs">
                        <button class="op-tab active" data-op="search">查找</button>
                        <button class="op-tab" data-op="insert">插入</button>
                        <button class="op-tab" data-op="inorder">中序遍历</button>
                    </div>

                    <div class="control-row" id="inputRow">
                        <span class="control-label">输入值：</span>
                        <input type="number" class="input-field" id="valueInput" value="7" min="1" max="99">
                        <button class="btn btn-primary" id="goBtn" style="margin-left:8px;">执行</button>
                    </div>

                    <div class="tree-visual" id="treeVisual"></div>

                    <div class="result-display" id="resultDisplay">
                        <span class="value" id="resultValue">输入值后点击"执行"</span>
                    </div>
                </div>

                <div class="vis-panel">
                    <div class="info-box">
                        <h4>当前状态</h4>
                        <p id="stepDescription">点击"执行"开始操作</p>
                    </div>

                    <div class="highlight-box" id="whyBox" style="display:none;">
                        <h4>为什么要这么做？</h4>
                        <p id="whyText"></p>
                    </div>

                    <div class="next-box" id="nextBox" style="display:none;">
                        <h4>下一步</h4>
                        <p id="nextText"></p>
                    </div>

                    <div class="info-box" style="margin-top:16px;">
                        <h4>BST 性质</h4>
                        <p>左子树所有节点 &lt; 根节点 &lt; 右子树所有节点</p>
                    </div>
                </div>
            </div>
        </main>

        <section class="vis-controls">
            <div class="control-row" id="buttonRow"></div>
        </section>
    </div>

    <script src="../shared/utils.js"></script>
    <script>
        var currentOp = "search";
        var steps = [];
        var stepIdx = 0;
        var stepManager = null;

        // 初始 BST
        var bst = {
            value: 8,
            left: {
                value: 3,
                left: { value: 1, left: null, right: null },
                right: { value: 6, left: { value: 4, left: null, right: null }, right: { value: 7, left: null, right: null } }
            },
            right: {
                value: 10,
                left: null,
                right: { value: 14, left: { value: 13, left: null, right: null }, right: null }
            }
        };

        // 把 BST 渲染成 HTML
        function renderTree(state) {
            var container = document.getElementById("treeVisual");
            var visited = state.visited || [];
            var current = state.current;
            var found = state.found;
            var path = state.path || [];

            function makeNode(node, level, side) {
                if (node === null) {
                    return '<div class="tree-node"><div class="null-node"></div><div class="node-label">null</div></div>';
                }
                var cls = "tree-node-box";
                if (found && node.value === found) cls += " found";
                else if (state.notfound && current === node.value) cls += " notfound";
                else if (path.includes(node.value)) cls += " current";
                else if (visited.includes(node.value)) cls += " visited";
                return '<div class="tree-node">' +
                    '<div class="' + cls + '">' + node.value + '</div>' +
                    '<div class="node-label">' + (side ? side : '') + '</div>' +
                    '</div>';
            }

            var html = '<div class="tree-level"><div class="tree-node">' +
                '<div class="tree-node-box ' + (current === bst.value ? 'current' : (visited.includes(bst.value) ? 'visited' : '')) + '">' + bst.value + '</div>' +
                '<div class="node-label">根</div></div></div>';

            html += '<div class="tree-edge"></div>';

            // 第二层
            html += '<div class="tree-level">';
            html += makeNode(bst.left, 1, 'L');
            html += makeNode(bst.right, 1, 'R');
            html += '</div>';

            if (bst.left || bst.right) {
                html += '<div class="tree-edge"></div>';
                // 第三层
                html += '<div class="tree-level">';
                html += makeNode(bst.left ? bst.left.left : null, 2, 'LL');
                html += makeNode(bst.left ? bst.left.right : null, 2, 'LR');
                html += makeNode(bst.right ? bst.right.left : null, 2, 'RL');
                html += makeNode(bst.right ? bst.right.right : null, 2, 'RR');
                html += '</div>';
            }

            if ((bst.left && (bst.left.left || bst.left.right)) || (bst.right && (bst.right.left || bst.right.right))) {
                html += '<div class="tree-edge"></div>';
                // 第四层
                html += '<div class="tree-level">';
                var ll = bst.left && bst.left.left;
                var lr = bst.left && bst.left.right;
                var rl = bst.right && bst.right.left;
                var rr = bst.right && bst.right.right;
                html += makeNode(ll && ll.left ? ll.left : null, 3, 'LLL');
                html += makeNode(ll && ll.right ? ll.right : null, 3, 'LLR');
                html += makeNode(lr && lr.left ? lr.left : null, 3, 'LRL');
                html += makeNode(lr && lr.right ? lr.right : null, 3, 'LRR');
                html += makeNode(rl && rl.left ? rl.left : null, 3, 'RLL');
                html += makeNode(rl && rl.right ? rl.right : null, 3, 'RLR');
                html += makeNode(rr && rr.left ? rr.left : null, 3, 'RRL');
                html += makeNode(rr && rr.right ? rr.right : null, 3, 'RRR');
                html += '</div>';
            }

            container.innerHTML = html;
        }

        // 生成查找步骤
        function genSearchSteps(target) {
            var s = [];
            var visited = [];
            var path = [];

            function search(node, depth) {
                if (node === null) {
                    s.push({
                        state: { visited: visited.slice(), current: target, path: path.slice(), found: null, notfound: true },
                        description: "到达空节点，返回 False",
                        why: "BST 中没找到 " + target,
                        next: null
                    });
                    return false;
                }

                visited.push(node.value);
                path.push(node.value);

                s.push({
                    state: { visited: visited.slice(), current: node.value, path: path.slice(), found: null, notfound: false },
                    description: "访问节点 " + node.value,
                    why: "比较 " + target + " 和 " + node.value,
                    next: null
                });

                if (target === node.value) {
                    s.push({
                        state: { visited: visited.slice(), current: node.value, path: path.slice(), found: node.value, notfound: false },
                        description: "找到 " + target + "！",
                        why: target + " == " + node.value,
                        next: null
                    });
                    return true;
                } else if (target < node.value) {
                    s.push({
                        state: { visited: visited.slice(), current: node.value, path: path.slice(), found: null, notfound: false },
                        description: target + " < " + node.value + "，往左子树",
                        why: "BST 性质：左子树所有节点 < 根节点",
                        next: "进入左子树"
                    });
                    return search(node.left, depth + 1);
                } else {
                    s.push({
                        state: { visited: visited.slice(), current: node.value, path: path.slice(), found: null, notfound: false },
                        description: target + " > " + node.value + "，往右子树",
                        why: "BST 性质：右子树所有节点 > 根节点",
                        next: "进入右子树"
                    });
                    return search(node.right, depth + 1);
                }
            }

            s.push({
                state: { visited: [], current: null, path: [], found: null, notfound: false },
                description: "开始查找 " + target,
                why: "从根节点开始，根据大小关系决定搜索方向",
                next: "比较根节点"
            });

            search(bst, 0);
            return s;
        }

        // 生成中序遍历步骤
        function genInorderSteps() {
            var s = [];
            var visited = [];
            var result = [];

            function inorder(node) {
                if (node === null) {
                    s.push({
                        state: { visited: visited.slice(), current: null, path: [], found: null, notfound: false, phase: "null" },
                        description: "遇到空节点，返回",
                        why: "空节点不需要遍历",
                        next: "返回上层"
                    });
                    return;
                }

                visited.push(node.value);
                s.push({
                    state: { visited: visited.slice(), current: node.value, path: [], found: null, notfound: false, phase: "enter" },
                    description: "进入节点 " + node.value,
                    why: "中序遍历：左 → 根 → 右，先处理左子树",
                    next: "遍历左子树"
                });

                inorder(node.left);

                s.push({
                    state: { visited: visited.slice(), current: node.value, path: [], found: null, notfound: false, phase: "visit" },
                    description: "访问节点 " + node.value + "，加入结果",
                    why: "左子树遍历完成，现在处理根节点",
                    next: "准备遍历右子树"
                });
                result.push(node.value);

                inorder(node.right);

                s.push({
                    state: { visited: visited.slice(), current: node.value, path: [], found: null, notfound: false, phase: "return" },
                    description: "节点 " + node.value + " 处理完成，返回",
                    why: "左右子树都处理完毕",
                    next: "返回上层"
                });
                visited.pop();
            }

            s.push({
                state: { visited: [], current: null, path: [], found: null, notfound: false },
                description: "开始中序遍历",
                why: "中序遍历 BST 得到升序序列",
                next: "进入根节点"
            });

            inorder(bst);

            s.push({
                state: { visited: visited.slice(), current: null, path: [], found: null, notfound: false, phase: "done", result: result },
                description: "遍历完成！结果：" + result.join(" → "),
                why: "BST 中序遍历得到升序序列",
                next: null
            });

            return s;
        }

        // 生成插入步骤
        function genInsertSteps(value) {
            var s = [];
            var visited = [];

            function insert(node, depth) {
                if (node === null) {
                    s.push({
                        state: { visited: visited.slice(), current: null, found: null, inserted: value, notfound: false, phase: "null" },
                        description: "找到空位置，插入 " + value,
                        why: "空位置就是插入点",
                        next: null
                    });
                    return { inserted: true };
                }

                visited.push(node.value);
                s.push({
                    state: { visited: visited.slice(), current: node.value, found: null, inserted: null, notfound: false, phase: "compare" },
                    description: "比较 " + value + " 和 " + node.value,
                    why: value + " < " + node.value + " 往左，否则往右",
                    next: null
                });

                if (value < node.value) {
                    s.push({
                        state: { visited: visited.slice(), current: node.value, found: null, inserted: null, notfind: false, phase: "left" },
                        description: value + " < " + node.value + "，往左走",
                        why: "BST 性质",
                        next: "进入左子树"
                    });
                    var result = insert(node.left, depth + 1);
                } else {
                    s.push({
                        state: { visited: visited.slice(), current: node.value, found: null, inserted: null, notfind: false, phase: "right" },
                        description: value + " > " + node.value + "，往右走",
                        why: "BST 性质",
                        next: "进入右子树"
                    });
                    var result = insert(node.right, depth + 1);
                }

                return result;
            }

            s.push({
                state: { visited: [], current: null, found: null, inserted: null, notfind: false },
                description: "开始插入 " + value,
                why: "按 BST 性质找到插入位置",
                next: "从根节点开始"
            });

            insert(bst, 0);

            s.push({
                state: { visited: [], current: null, found: value, inserted: value, notfind: false, phase: "done" },
                description: "插入完成！",
                why: value + " 已插入到 BST 中",
                next: null
            });

            return s;
        }

        function render(state) {
            renderTree(state);

            var resultEl = document.getElementById("resultValue");
            if (state.found !== null && state.found !== undefined) {
                resultEl.innerHTML = "✓ 找到 " + state.found + "！";
            } else if (state.notfound) {
                resultEl.innerHTML = "✗ 未找到 " + document.getElementById("valueInput").value;
            } else if (state.inserted) {
                resultEl.innerHTML = "✓ 插入 " + state.inserted;
            } else if (state.result) {
                resultEl.innerHTML = state.result.join(" → ");
            } else {
                resultEl.innerHTML = "当前节点：" + (state.current || "无");
            }

            var stepInfo = stepManager.getStepInfo();
            document.getElementById("stepDescription").textContent = stepInfo.description || "";

            var whyText = document.getElementById("whyText");
            var nextText = document.getElementById("nextText");

            if (stepInfo.why) {
                document.getElementById("whyBox").style.display = "block";
                whyText.textContent = stepInfo.why;
            } else {
                document.getElementById("whyBox").style.display = "none";
            }

            if (stepInfo.next) {
                document.getElementById("nextBox").style.display = "block";
                nextText.textContent = stepInfo.next;
            } else {
                document.getElementById("nextBox").style.display = "none";
            }

            updateButtons();
        }

        function updateButtons() {
            var btnPrev = document.getElementById("btnPrev");
            var btnNext = document.getElementById("btnNext");
            var stepIndicator = document.getElementById("stepIndicator");

            if (btnPrev) btnPrev.disabled = !stepManager.hasPrev();
            if (btnNext) btnNext.disabled = !stepManager.hasNext();

            if (stepIndicator && stepManager) {
                var curr = stepManager.getCurrentStep() + 1;
                var total = stepManager.getTotalSteps();
                stepIndicator.textContent = "步骤 " + curr + " / " + total;
            }
        }

        function init(op, value) {
            currentOp = op;
            if (op === "search") {
                steps = genSearchSteps(value);
            } else if (op === "inorder") {
                steps = genInorderSteps();
            } else if (op === "insert") {
                steps = genInsertSteps(value);
            }
            stepManager = createStepManager(steps, render);
            stepManager.render();
            updateButtons();
        }

        window.addEventListener("DOMContentLoaded", function() {
            var buttonRow = document.getElementById("buttonRow");
            buttonRow.innerHTML =
                '<button class="btn btn-secondary" id="btnPrev" disabled>← 上一步</button>' +
                '<span class="step-indicator" id="stepIndicator">步骤 1 / 1</span>' +
                '<button class="btn btn-primary" id="btnNext" disabled>下一步 →</button>' +
                '<button class="btn btn-secondary" id="btnReset">重置</button>';

            var opTabs = document.querySelectorAll(".op-tab");
            opTabs.forEach(function(tab) {
                tab.addEventListener("click", function() {
                    opTabs.forEach(function(t) { t.classList.remove("active"); });
                    tab.classList.add("active");
                    var val = parseInt(document.getElementById("valueInput").value) || 7;
                    init(tab.getAttribute("data-op"), val);
                });
            });

            document.getElementById("goBtn").addEventListener("click", function() {
                var val = parseInt(document.getElementById("valueInput").value) || 7;
                init(currentOp, val);
            });

            document.getElementById("btnPrev").addEventListener("click", function() {
                stepManager.prev();
                updateButtons();
            });

            document.getElementById("btnNext").addEventListener("click", function() {
                stepManager.next();
                updateButtons();
            });

            document.getElementById("btnReset").addEventListener("click", function() {
                var val = parseInt(document.getElementById("valueInput").value) || 7;
                init(currentOp, val);
            });

            init("search", 7);
        });
    </script>
</body>
</html>
