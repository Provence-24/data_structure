<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哈希表 - 交互演示</title>
    <link rel="stylesheet" href="../shared/style.css">
    <style>
        .vis-container {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
        }

        .vis-panel {
            flex: 1;
            min-width: 320px;
        }

        .hash-visual {
            padding: 20px;
            min-height: 280px;
        }

        .slot-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .slot-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slot-index {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: #666;
        }

        .slot-box {
            min-width: 200px;
            padding: 8px 12px;
            border: 2px solid var(--color-idle);
            border-radius: 8px;
            background: white;
            transition: all 0.3s;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .slot-box.active {
            border-color: var(--color-active);
            background: #ffebee;
        }

        .slot-box.highlight {
            border-color: var(--color-primary);
            background: #e3f2fd;
        }

        .slot-item {
            padding: 4px 10px;
            background: #e8f5e9;
            border: 1px solid #a5d6a7;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: #2e7d32;
        }

        .slot-item.current {
            background: #ffebee;
            border-color: var(--color-active);
            color: var(--color-active);
        }

        .slot-item.new {
            background: #e3f2fd;
            border-color: var(--color-primary);
            color: #1976d2;
            font-weight: 700;
        }

        .slot-arrow {
            color: #999;
            font-size: 1.2rem;
        }

        .result-display {
            font-family: var(--font-mono);
            font-size: 1rem;
            background: #1d1d1f;
            color: #4ade80;
            padding: 14px 16px;
            border-radius: 8px;
            margin-top: 16px;
        }

        .info-box {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 12px;
        }

        .info-box h4 {
            font-size: 0.85rem;
            color: #6e6e73;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .highlight-box {
            background: #fff3cd;
            border-left: 4px solid var(--color-warning);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin-top: 12px;
        }

        .highlight-box h4 { font-size: 0.85rem; color: #856404; margin-bottom: 6px; }
        .highlight-box p { font-size: 0.95rem; color: #856404; }

        .next-box {
            background: #e3f2fd;
            border-left: 4px solid var(--color-primary);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin-top: 8px;
        }

        .next-box h4 { font-size: 0.85rem; color: #0d47a1; margin-bottom: 6px; }
        .next-box p { font-size: 0.95rem; color: #0d47a1; }

        .op-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .op-tab {
            padding: 10px 18px;
            border: 2px solid var(--color-border);
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .op-tab:hover { border-color: var(--color-primary); background: #e3f2fd; }
        .op-tab.active { background: var(--color-primary); border-color: var(--color-primary); color: white; }

        .control-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .control-label { font-size: 0.9rem; color: var(--color-text-muted); }

        .input-field {
            padding: 10px 14px;
            border: 2px solid var(--color-border);
            border-radius: 8px;
            font-size: 1rem;
            width: 80px;
        }

        .input-field-wide {
            width: 120px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="vis-header">
            <h1>哈希表 - 交互演示</h1>
            <p class="subtitle">哈希函数、链地址法冲突处理</p>
        </header>

        <main class="vis-main">
            <div class="vis-container">
                <div class="vis-panel">
                    <div class="op-tabs" id="opTabs">
                        <button class="op-tab active" data-op="insert">插入</button>
                        <button class="op-tab" data-op="search">查找</button>
                        <button class="op-tab" data-op="delete">删除</button>
                    </div>

                    <div class="control-row" id="inputRow">
                        <span class="control-label">键：</span>
                        <input type="text" class="input-field" id="keyInput" value="apple" style="width:100px;">
                        <span class="control-label" style="margin-left:8px;">值：</span>
                        <input type="number" class="input-field" id="valueInput" value="10" style="width:70px;">
                        <button class="btn btn-primary" id="goBtn" style="margin-left:8px;">执行</button>
                    </div>

                    <div class="hash-visual" id="hashVisual"></div>

                    <div class="result-display" id="resultDisplay">
                        <span id="resultValue">点击"执行"开始</span>
                    </div>
                </div>

                <div class="vis-panel">
                    <div class="info-box">
                        <h4>当前状态</h4>
                        <p id="stepDescription">点击"执行"开始操作</p>
                    </div>

                    <div class="highlight-box" id="whyBox" style="display:none;">
                        <h4>为什么要这么做？</h4>
                        <p id="whyText"></p>
                    </div>

                    <div class="next-box" id="nextBox" style="display:none;">
                        <h4>下一步</h4>
                        <p id="nextText"></p>
                    </div>

                    <div class="info-box" style="margin-top:16px;">
                        <h4>哈希表参数</h4>
                        <p>槽位数：5<br>哈希函数：hash(key) % 5</p>
                    </div>
                </div>
            </div>
        </main>

        <section class="vis-controls">
            <div class="control-row" id="buttonRow"></div>
        </section>
    </div>

    <script src="../shared/utils.js"></script>
    <script>
        var currentOp = "insert";
        var steps = [];
        var stepManager = null;

        var SIZE = 5;
        var table = [[], [], [], [], []]; // 5个槽位，每个是链表

        function hashFn(key) {
            return hashString(key) % SIZE;
        }

        function hashString(s) {
            var h = 0;
            for (var i = 0; i < s.length; i++) {
                h = ((h << 5) - h + s.charCodeAt(i)) | 0;
            }
            return Math.abs(h);
        }

        function renderHash(state) {
            var container = document.getElementById("hashVisual");
            var activeSlot = state.activeSlot;
            var highlightSlot = state.highlightSlot;
            var currentKey = state.currentKey;
            var newKey = state.newKey;
            var found = state.found;
            var deleted = state.deleted;

            var html = '<div class="slot-grid">';

            for (var i = 0; i < SIZE; i++) {
                var cls = "slot-box";
                if (activeSlot === i) cls += " active";
                else if (highlightSlot === i) cls += " highlight";

                html += '<div class="slot-row">';
                html += '<div class="slot-index">' + i + '</div>';
                html += '<div class="' + cls + '">';

                var items = table[i];
                if (items.length === 0) {
                    html += '<span style="color:#ccc;font-size:0.85rem;">空</span>';
                } else {
                    for (var j = 0; j < items.length; j++) {
                        var itemCls = "slot-item";
                        if (newKey && items[j].key === newKey) itemCls += " new";
                        else if (currentKey && items[j].key === currentKey) itemCls += " current";
                        else if (deleted && items[j].key === deleted) itemCls += " current";
                        if (found && items[j].key === found) itemCls += " current";
                        html += '<div class="' + itemCls + '">' + items[j].key + ':' + items[j].value + '</div>';
                    }
                }

                html += '</div></div></div>';
            }

            container.innerHTML = html;
        }

        function genInsertSteps(key, value) {
            var s = [];
            var h = hashFn(key);

            s.push({
                state: { activeSlot: null, highlightSlot: null, currentKey: key, newKey: null, found: null, deleted: null },
                description: "插入 key='" + key + "', value=" + value,
                why: "hash('" + key + "') % 5 = " + h,
                next: "定位到槽位 " + h
            });

            s.push({
                state: { activeSlot: h, highlightSlot: null, currentKey: key, newKey: null, found: null, deleted: null },
                description: "定位到槽位 " + h,
                why: "哈希函数决定键值对存储的位置",
                next: "遍历链表查找或插入"
            });

            var bucket = table[h];
            var foundIdx = -1;
            for (var i = 0; i < bucket.length; i++) {
                if (bucket[i].key === key) {
                    foundIdx = i;
                    break;
                }
            }

            if (foundIdx >= 0) {
                s.push({
                    state: { activeSlot: h, highlightSlot: null, currentKey: key, newKey: null, found: null, deleted: null },
                    description: "槽位 " + h + " 已有 key='" + key + "'，更新值",
                    why: "找到已存在的 key，直接更新",
                    next: "更新完成"
                });
                bucket[foundIdx].value = value;
            } else {
                s.push({
                    state: { activeSlot: h, highlightSlot: null, currentKey: key, newKey: null, found: null, deleted: null },
                    description: "槽位 " + h + " 链表中没有 '" + key + "'，追加到链表末尾",
                    why: "新键值对，添加到链表头部或末尾",
                    next: "插入完成"
                });
                bucket.push({ key: key, value: value });
            }

            s.push({
                state: { activeSlot: null, highlightSlot: h, currentKey: null, newKey: key, found: null, deleted: null },
                description: "插入完成！",
                why: key + " 已存入槽位 " + h + " 的链表中",
                next: null
            });

            return s;
        }

        function genSearchSteps(key) {
            var s = [];
            var h = hashFn(key);

            s.push({
                state: { activeSlot: null, highlightSlot: null, currentKey: key, newKey: null, found: null, deleted: null },
                description: "查找 key='" + key + "'",
                why: "hash('" + key + "') % 5 = " + h,
                next: "定位到槽位 " + h
            });

            s.push({
                state: { activeSlot: h, highlightSlot: null, currentKey: key, newKey: null, found: null, deleted: null },
                description: "定位到槽位 " + h + "，遍历链表",
                why: "在槽位 " + h + " 的链表中查找",
                next: null
            });

            var bucket = table[h];
            for (var i = 0; i < bucket.length; i++) {
                s.push({
                    state: { activeSlot: h, highlightSlot: null, currentKey: key, newKey: null, found: null, deleted: null },
                    description: "检查节点 " + (i + 1) + "：'" + bucket[i].key + "' = " + bucket[i].value,
                    why: "逐一比对链表中的键",
                    next: key === bucket[i].key ? "找到！" : "继续查找"
                });

                if (bucket[i].key === key) {
                    s.push({
                        state: { activeSlot: h, highlightSlot: null, currentKey: null, newKey: null, found: key, deleted: null },
                        description: "找到！" + key + " = " + bucket[i].value,
                        why: "键匹配，返回对应的值",
                        next: null
                    });
                    return s;
                }
            }

            s.push({
                state: { activeSlot: h, highlightSlot: null, currentKey: key, newKey: null, found: null, deleted: null },
                description: "槽位 " + h + " 链表中未找到 '" + key + "'",
                why: "遍历完整个链表都没找到",
                next: null
            });

            return s;
        }

        function genDeleteSteps(key) {
            var s = [];
            var h = hashFn(key);

            s.push({
                state: { activeSlot: null, highlightSlot: null, currentKey: key, newKey: null, found: null, deleted: null },
                description: "删除 key='" + key + "'",
                why: "hash('" + key + "') % 5 = " + h,
                next: "定位到槽位 " + h
            });

            s.push({
                state: { activeSlot: h, highlightSlot: null, currentKey: key, newKey: null, found: null, deleted: null },
                description: "定位到槽位 " + h + "，遍历链表",
                why: "在槽位 " + h + " 的链表中查找要删除的节点",
                next: null
            });

            var bucket = table[h];
            for (var i = 0; i < bucket.length; i++) {
                s.push({
                    state: { activeSlot: h, highlightSlot: null, currentKey: key, newKey: null, found: null, deleted: null },
                    description: "检查节点：'" + bucket[i].key + "' = " + bucket[i].value,
                    why: key === bucket[i].key ? "找到要删除的节点" : "不是目标，继续",
                    next: null
                });

                if (bucket[i].key === key) {
                    bucket.splice(i, 1);
                    s.push({
                        state: { activeSlot: null, highlightSlot: h, currentKey: null, newKey: null, found: null, deleted: key },
                        description: "删除完成！",
                        why: "从槽位 " + h + " 的链表中移除了 '" + key + "'",
                        next: null
                    });
                    return s;
                }
            }

            s.push({
                state: { activeSlot: h, highlightSlot: null, currentKey: key, newKey: null, found: null, deleted: null },
                description: "槽位 " + h + " 链表中未找到 '" + key + "'，删除失败",
                why: "要删除的键不存在",
                next: null
            });

            return s;
        }

        function render(state) {
            renderHash(state);

            var resultEl = document.getElementById("resultValue");
            if (state.found) {
                resultEl.textContent = "✓ 找到 " + state.found;
            } else if (state.deleted) {
                resultEl.textContent = "✓ 删除 " + state.deleted;
            } else if (state.newKey) {
                resultEl.textContent = "✓ 插入 " + state.newKey;
            } else {
                resultEl.textContent = "哈希表槽位数：" + SIZE;
            }

            var stepInfo = stepManager.getStepInfo();
            document.getElementById("stepDescription").textContent = stepInfo.description || "";

            if (stepInfo.why) {
                document.getElementById("whyBox").style.display = "block";
                document.getElementById("whyText").textContent = stepInfo.why;
            } else {
                document.getElementById("whyBox").style.display = "none";
            }

            if (stepInfo.next) {
                document.getElementById("nextBox").style.display = "block";
                document.getElementById("nextText").textContent = stepInfo.next;
            } else {
                document.getElementById("nextBox").style.display = "none";
            }

            updateButtons();
        }

        function updateButtons() {
            var btnPrev = document.getElementById("btnPrev");
            var btnNext = document.getElementById("btnNext");
            var stepIndicator = document.getElementById("stepIndicator");
            if (btnPrev) btnPrev.disabled = !stepManager.hasPrev();
            if (btnNext) btnNext.disabled = !stepManager.hasNext();
            if (stepIndicator && stepManager) {
                stepIndicator.textContent = "步骤 " + (stepManager.getCurrentStep() + 1) + " / " + stepManager.getTotalSteps();
            }
        }

        function init(op, key, value) {
            currentOp = op;
            if (op === "insert") steps = genInsertSteps(key, value);
            else if (op === "search") steps = genSearchSteps(key);
            else if (op === "delete") steps = genDeleteSteps(key);
            stepManager = createStepManager(steps, render);
            stepManager.render();
            updateButtons();
        }

        window.addEventListener("DOMContentLoaded", function() {
            var buttonRow = document.getElementById("buttonRow");
            buttonRow.innerHTML =
                '<button class="btn btn-secondary" id="btnPrev" disabled>← 上一步</button>' +
                '<span class="step-indicator" id="stepIndicator">步骤 1 / 1</span>' +
                '<button class="btn btn-primary" id="btnNext" disabled>下一步 →</button>' +
                '<button class="btn btn-secondary" id="btnReset">重置</button>';

            var opTabs = document.querySelectorAll(".op-tab");
            opTabs.forEach(function(tab) {
                tab.addEventListener("click", function() {
                    opTabs.forEach(function(t) { t.classList.remove("active"); });
                    tab.classList.add("active");
                    var key = document.getElementById("keyInput").value || "apple";
                    var val = parseInt(document.getElementById("valueInput").value) || 10;
                    init(tab.getAttribute("data-op"), key, val);
                });
            });

            document.getElementById("goBtn").addEventListener("click", function() {
                var key = document.getElementById("keyInput").value || "apple";
                var val = parseInt(document.getElementById("valueInput").value) || 10;
                init(currentOp, key, val);
            });

            document.getElementById("btnPrev").addEventListener("click", function() { stepManager.prev(); updateButtons(); });
            document.getElementById("btnNext").addEventListener("click", function() { stepManager.next(); updateButtons(); });
            document.getElementById("btnReset").addEventListener("click", function() {
                table = [[], [], [], [], []];
                var key = document.getElementById("keyInput").value || "apple";
                var val = parseInt(document.getElementById("valueInput").value) || 10;
                init(currentOp, key, val);
            });

            init("insert", "apple", 10);
        });
    </script>
</body>
</html>
