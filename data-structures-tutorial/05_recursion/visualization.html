<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>递归 - 交互演示</title>
    <link rel="stylesheet" href="../shared/style.css">
    <style>
        .vis-container {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
        }

        .vis-panel {
            flex: 1;
            min-width: 320px;
        }

        .data-display {
            font-family: var(--font-mono);
            font-size: 1rem;
            background: #1d1d1f;
            color: #f5f5f7;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            white-space: pre-wrap;
        }

        /* 递归树样式 */
        .tree-visual {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            min-height: 300px;
        }

        .tree-node {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tree-node-box {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--color-idle);
            border-radius: 50%;
            font-family: var(--font-mono);
            font-size: 1.2rem;
            font-weight: 700;
            background: white;
            transition: all 0.3s;
            position: relative;
        }

        .tree-node-box.active {
            border-color: var(--color-active);
            background: #ffebee;
            color: var(--color-active);
            transform: scale(1.15);
            box-shadow: 0 0 16px rgba(229, 57, 53, 0.5);
        }

        .tree-node-box.done {
            border-color: var(--color-done);
            background: #e8f5e9;
            color: #2e7d32;
        }

        .tree-node-box.returning {
            border-color: var(--color-primary);
            background: #e3f2fd;
            color: #1976d2;
        }

        .tree-node-label {
            position: absolute;
            top: -20px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #666;
            white-space: nowrap;
        }

        .tree-children {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .tree-branch {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tree-line {
            width: 2px;
            height: 20px;
            background: #ccc;
        }

        /* 栈帧样式 */
        .stack-visual {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 300px;
        }

        .stack-frame {
            width: 200px;
            padding: 12px 16px;
            margin-bottom: 8px;
            border: 2px solid var(--color-idle);
            border-radius: 8px;
            background: white;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            text-align: center;
            transition: all 0.3s;
        }

        .stack-frame.active {
            border-color: var(--color-active);
            background: #ffebee;
            box-shadow: 0 0 12px rgba(229, 57, 53, 0.4);
        }

        .stack-frame.returning {
            border-color: var(--color-done);
            background: #e8f5e9;
            opacity: 0.7;
        }

        .stack-frame .func-name {
            font-weight: 700;
            color: #1d1d1f;
        }

        .stack-frame .param {
            color: #666;
            font-size: 0.85rem;
        }

        .stack-frame .return-value {
            color: #2e7d32;
            font-weight: 600;
            margin-top: 4px;
        }

        .stack-arrow {
            color: #999;
            font-size: 1.5rem;
            margin: 4px 0;
        }

        .stack-bottom {
            padding: 8px 16px;
            background: #f5f5f5;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #666;
        }

        /* 斐波那契树样式 */
        .fib-tree {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .fib-node {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .fib-box {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--color-idle);
            border-radius: 50%;
            font-family: var(--font-mono);
            font-size: 1rem;
            font-weight: 700;
            background: white;
            transition: all 0.3s;
        }

        .fib-box.active {
            border-color: var(--color-active);
            background: #ffebee;
            color: var(--color-active);
            transform: scale(1.2);
            box-shadow: 0 0 12px rgba(229, 57, 53, 0.5);
        }

        .fib-box.done {
            border-color: var(--color-done);
            background: #e8f5e9;
            color: #2e7d32;
        }

        .fib-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .fib-branch-line {
            width: 1px;
            height: 12px;
            background: #ccc;
        }

        /* 操作标签 */
        .op-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .op-tab {
            padding: 10px 18px;
            border: 2px solid var(--color-border);
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: var(--font-main);
            transition: all 0.2s;
        }

        .op-tab:hover {
            border-color: var(--color-primary);
            background: #e3f2fd;
        }

        .op-tab.active {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: white;
        }

        .info-box {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 12px;
        }

        .info-box h4 {
            font-size: 0.85rem;
            color: #6e6e73;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-box p {
            font-size: 1rem;
            line-height: 1.6;
            color: #1d1d1f;
        }

        .highlight-box {
            background: #fff3cd;
            border-left: 4px solid var(--color-warning);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin-top: 12px;
        }

        .highlight-box h4 {
            font-size: 0.85rem;
            color: #856404;
            margin-bottom: 6px;
        }

        .highlight-box p {
            font-size: 0.95rem;
            color: #856404;
            line-height: 1.5;
        }

        .next-box {
            background: #e3f2fd;
            border-left: 4px solid var(--color-primary);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin-top: 8px;
        }

        .next-box h4 {
            font-size: 0.85rem;
            color: #0d47a1;
            margin-bottom: 6px;
        }

        .next-box p {
            font-size: 0.95rem;
            color: #0d47a1;
            line-height: 1.5;
        }

        .control-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .control-label {
            font-size: 0.9rem;
            color: var(--color-text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="vis-header">
            <h1>递归 - 交互演示</h1>
            <p class="subtitle">理解递归调用栈 | 点击"下一步"前进一步</p>
        </header>

        <main class="vis-main">
            <div class="vis-container">
                <div class="vis-panel">
                    <div class="op-tabs" id="opTabs">
                        <button class="op-tab active" data-op="factorial">阶乘</button>
                        <button class="op-tab" data-op="fibonacci">斐波那契</button>
                        <button class="op-tab" data-op="reverse">字符串反转</button>
                    </div>

                    <div class="data-display" id="dataDisplay">
递归状态将显示在这里
                    </div>

                    <div class="tree-visual" id="visualArea">
                    </div>
                </div>

                <div class="vis-panel">
                    <div class="info-box">
                        <h4>当前步骤</h4>
                        <p id="stepDescription">点击"下一步"开始演示</p>
                        <div class="step-code" id="stepCode"></div>
                    </div>

                    <div class="highlight-box" id="whyBox" style="display:none;">
                        <h4>为什么要这么做？</h4>
                        <p id="whyText"></p>
                    </div>

                    <div class="next-box" id="nextBox" style="display:none;">
                        <h4>下一步将做什么？</h4>
                        <p id="nextText"></p>
                    </div>

                    <div class="info-box" style="margin-top: 16px;">
                        <h4>调用栈</h4>
                        <div id="stackDisplay">栈为空</div>
                    </div>
                </div>
            </div>
        </main>

        <section class="vis-controls">
            <div class="control-row" id="inputRow">
                <span class="control-label" id="valueLabel">输入值：</span>
                <input type="number" class="input-field" id="valueInput" value="4" min="1" max="8">
                <button class="btn btn-secondary" id="restartBtn" style="margin-left: 12px;">重新开始</button>
            </div>
            <div class="control-row" id="buttonRow">
            </div>
        </section>
    </div>

    <script src="../shared/utils.js"></script>
    <script>
        // ============================================================================
        // 全局状态
        // ============================================================================

        var currentOperation = "factorial";
        var steps = [];
        var stepManager = null;

        // ============================================================================
        // 阶乘步骤生成
        // ============================================================================

        function generateFactorialSteps(n) {
            var steps = [];
            var stack = [];

            // 初始状态
            steps.push({
                state: {
                    type: "factorial",
                    n: n,
                    phase: "start",
                    stack: [],
                    currentNode: null,
                    returnValue: null
                },
                description: "阶乘 factorial(" + n + ")",
                why: "递归需要明确输入值",
                next: "开始递归调用"
            });

            // 生成递归调用步骤
            function addCallSteps(n, depth, parentReturn) {
                stack.push(n);
                var callStack = stack.slice();

                // 调用当前节点
                steps.push({
                    state: {
                        type: "factorial",
                        n: n,
                        phase: "call",
                        stack: callStack,
                        currentNode: n,
                        depth: depth,
                        returnValue: null
                    },
                    description: "调用 factorial(" + n + ")",
                    why: "压栈：为 factorial(" + n + ") 分配栈帧",
                    next: n > 1 ? "递归调用 factorial(" + (n - 1) + ")" : "到达终止条件，返回 1"
                });

                if (n <= 1) {
                    // 终止条件返回
                    stack.pop();
                    steps.push({
                        state: {
                            type: "factorial",
                            n: n,
                            phase: "return",
                            stack: stack.slice(),
                            currentNode: n,
                            depth: depth,
                            returnValue: 1
                        },
                        description: "factorial(" + n + ") = 1，返回",
                        why: "终止条件：n <= 1 时返回 1",
                        next: parentReturn !== null ? "继续返回" : "递归结束"
                    });
                    return 1;
                } else {
                    var childReturn = addCallSteps(n - 1, depth + 1, n);
                    var result = n * childReturn;

                    stack.pop();
                    steps.push({
                        state: {
                            type: "factorial",
                            n: n,
                            phase: "compute",
                            stack: stack.slice(),
                            currentNode: n,
                            depth: depth,
                            returnValue: result,
                            childReturn: childReturn
                        },
                        description: n + " × " + childReturn + " = " + result + "，返回",
                        why: "弹栈：factorial(" + n + ") 计算完成，返回 " + result,
                        next: parentReturn !== null ? "继续返回" : "递归结束"
                    });
                    return result;
                }
            }

            addCallSteps(n, 0, null);

            // 最终结果
            var finalResult = 1;
            for (var i = 2; i <= n; i++) finalResult *= i;

            steps.push({
                state: {
                    type: "factorial",
                    n: n,
                    phase: "done",
                    stack: [],
                    currentNode: null,
                    returnValue: finalResult
                },
                description: "递归完成！factorial(" + n + ") = " + finalResult,
                why: "所有栈帧都已弹栈，递归调用链结束",
                next: null
            });

            return steps;
        }

        // ============================================================================
        // 斐波那契步骤生成
        // ============================================================================

        function generateFibonacciSteps(n) {
            var steps = [];
            var callStack = [];

            // 初始状态
            steps.push({
                state: {
                    type: "fibonacci",
                    n: n,
                    phase: "start",
                    stack: [],
                    activeCalls: [],
                    returnValues: {}
                },
                description: "斐波那契 fibonacci(" + n + ")",
                why: "斐波那契数列：fib(n) = fib(n-1) + fib(n-2)",
                next: "开始构建递归调用树"
            });

            // 递归生成斐波那契调用树
            function buildFibTree(n, depth, callPath) {
                callStack.push({n: n, path: callPath, depth: depth});

                var currentStack = callStack.slice();
                steps.push({
                    state: {
                        type: "fibonacci",
                        n: n,
                        phase: "call",
                        stack: currentStack,
                        activeCalls: callStack.map(function(c) { return c.path; }),
                        returnValues: {},
                        depth: depth,
                        path: callPath
                    },
                    description: "调用 fibonacci(" + n + ")",
                    why: "压栈：需要计算 fib(" + n + ")",
                    next: depth >= n ? "到达终止条件" : "继续递归调用"
                });

                if (n <= 1) {
                    callStack.pop();
                    steps.push({
                        state: {
                            type: "fibonacci",
                            n: n,
                            phase: "return-base",
                            stack: callStack.slice(),
                            activeCalls: callStack.map(function(c) { return c.path; }),
                            returnValues: {[callPath]: n},
                            depth: depth,
                            path: callPath,
                            returnValue: n
                        },
                        description: "fibonacci(" + n + ") = " + n + "（终止条件）",
                        why: "终止条件：fib(0)=0, fib(1)=1",
                        next: "返回上层继续计算"
                    });
                    return {value: n, path: callPath};
                }

                // 递归调用左子节点
                var leftResult = buildFibTree(n - 1, depth + 1, callPath + "-L");

                callStack.pop();
                var currentStackAfterLeft = callStack.slice();

                steps.push({
                    state: {
                        type: "fibonacci",
                        n: n,
                        phase: "after-left",
                        stack: currentStackAfterLeft,
                        activeCalls: callStack.map(function(c) { return c.path; }),
                        returnValues: {[leftResult.path]: leftResult.value},
                        depth: depth,
                        path: callPath,
                        leftDone: true
                    },
                    description: "fib(" + n + ") 收到左子节点结果：" + leftResult.value,
                    why: "等待右子节点计算完成",
                    next: "递归调用 fib(" + (n - 2) + ")"
                });

                // 递归调用右子节点
                var rightResult = buildFibTree(n - 2, depth + 1, callPath + "-R");

                callStack.pop();
                var finalResult = leftResult.value + rightResult.value;

                steps.push({
                    state: {
                        type: "fibonacci",
                        n: n,
                        phase: "compute",
                        stack: callStack.slice(),
                        activeCalls: callStack.map(function(c) { return c.path; }),
                        returnValues: {
                            [leftResult.path]: leftResult.value,
                            [rightResult.path]: rightResult.value,
                            [callPath]: finalResult
                        },
                        depth: depth,
                        path: callPath,
                        returnValue: finalResult,
                        leftValue: leftResult.value,
                        rightValue: rightResult.value
                    },
                    description: "fib(" + n + ") = " + leftResult.value + " + " + rightResult.value + " = " + finalResult,
                    why: "计算完成，返回结果给上层",
                    next: "返回上层"
                });

                return {value: finalResult, path: callPath};
            }

            buildFibTree(n, 0, "root");

            // 计算 fib(n) 的实际值用于展示
            function fibActual(k) {
                if (k <= 0) return 0;
                if (k === 1) return 1;
                return fibActual(k - 1) + fibActual(k - 2);
            }

            var actualResult = fibActual(n);

            steps.push({
                state: {
                    type: "fibonacci",
                    n: n,
                    phase: "done",
                    stack: [],
                    activeCalls: [],
                    returnValues: {"root": actualResult}
                },
                description: "递归完成！fibonacci(" + n + ") = " + actualResult,
                why: "所有递归调用都已完成",
                next: null
            });

            return steps;
        }

        // ============================================================================
        // 字符串反转步骤生成
        // ============================================================================

        function generateReverseSteps(s) {
            var steps = [];
            var stack = [];

            steps.push({
                state: {
                    type: "reverse",
                    s: s,
                    phase: "start",
                    stack: [],
                    currentStr: s,
                    returnValue: null
                },
                description: "反转字符串 \"" + s + "\"",
                why: "字符串反转用递归：s = s[-1] + reverse(s[:-1])",
                next: "开始递归调用"
            });

            function reverseRecursive(str, depth) {
                stack.push({str: str, depth: depth});

                steps.push({
                    state: {
                        type: "reverse",
                        s: s,
                        phase: "call",
                        stack: stack.slice(),
                        currentStr: str,
                        depth: depth,
                        returnValue: null
                    },
                    description: "reverse(\"" + str + "\")",
                    why: "压栈：需要处理 \"" + str + "\"",
                    next: str.length > 1 ? "递归调用 reverse(\"" + str.slice(0, -1) + "\")" : "到达终止条件"
                });

                if (str.length <= 1) {
                    stack.pop();
                    steps.push({
                        state: {
                            type: "reverse",
                            s: s,
                            phase: "return-base",
                            stack: stack.slice(),
                            currentStr: str,
                            depth: depth,
                            returnValue: str
                        },
                        description: "reverse(\"" + str + "\") = \"" + str + "\"（单字符，返回）",
                        why: "终止条件：单字符直接返回",
                        next: "返回上层"
                    });
                    return str;
                }

                var childResult = reverseRecursive(str.slice(0, -1), depth + 1);
                var result = str[str.length - 1] + childResult;

                stack.pop();
                steps.push({
                    state: {
                        type: "reverse",
                        s: s,
                        phase: "compute",
                        stack: stack.slice(),
                        currentStr: str,
                        depth: depth,
                        returnValue: result,
                        childResult: childResult,
                        char: str[str.length - 1]
                    },
                    description: "\"" + str[str.length - 1] + "\" + \"" + childResult + "\" = \"" + result + "\"",
                    why: "组合：最后一个字符 + 前面反转结果",
                    next: "返回上层"
                });

                return result;
            }

            reverseRecursive(s, 0);

            var finalResult = s.split('').reverse().join('');

            steps.push({
                state: {
                    type: "reverse",
                    s: s,
                    phase: "done",
                    stack: [],
                    currentStr: s,
                    returnValue: finalResult
                },
                description: "递归完成！reverse(\"" + s + "\") = \"" + finalResult + "\"",
                why: "所有栈帧都已弹栈",
                next: null
            });

            return steps;
        }

        // ============================================================================
        // 渲染函数
        // ============================================================================

        function renderFactorial(state) {
            var container = document.getElementById("visualArea");
            container.innerHTML = "";

            var stack = state.stack || [];

            if (state.phase === "done" || stack.length === 0) {
                if (state.returnValue !== null) {
                    container.innerHTML = '<div class="tree-node">' +
                        '<div class="tree-node-box done">' + state.returnValue + '</div>' +
                        '<div style="margin-top:12px;font-size:0.9rem;color:#666;">递归完成</div>' +
                        '</div>';
                } else {
                    container.innerHTML = '<div style="color:#999;padding:40px;">等待开始...</div>';
                }
                return;
            }

            // 渲染栈帧
            var html = '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">';

            for (var i = 0; i < stack.length; i++) {
                var n = stack[i];
                var isActive = (i === stack.length - 1) && (state.phase === "call" || state.phase === "compute");
                var isReturning = state.phase === "return" || (state.phase === "compute" && i === stack.length - 1);

                html += '<div class="stack-frame ' + (isActive ? 'active' : '') + ' ' + (isReturning ? 'returning' : '') + '">';
                html += '<div class="func-name">factorial</div>';
                html += '<div class="param">n = ' + n + '</div>';

                if (isReturning && state.returnValue !== null) {
                    html += '<div class="return-value">→ ' + state.returnValue + '</div>';
                } else if (isActive && state.phase === "compute" && state.childReturn !== undefined) {
                    html += '<div class="return-value">← ' + state.childReturn + '</div>';
                }

                html += '</div>';

                if (i < stack.length - 1) {
                    html += '<div class="stack-arrow">↓</div>';
                }
            }

            html += '<div class="stack-bottom">← 栈底</div>';
            html += '</div>';

            container.innerHTML = html;
        }

        function renderFibonacci(state) {
            var container = document.getElementById("visualArea");
            container.innerHTML = "";

            var stack = state.stack || [];

            if (state.phase === "done" || stack.length === 0) {
                if (state.returnValues && state.returnValues["root"] !== undefined) {
                    container.innerHTML = '<div class="tree-node">' +
                        '<div class="tree-node-box done">fib=' + state.returnValues["root"] + '</div>' +
                        '<div style="margin-top:12px;font-size:0.9rem;color:#666;">递归完成</div>' +
                        '</div>';
                } else {
                    container.innerHTML = '<div style="color:#999;padding:40px;">等待开始...</div>';
                }
                return;
            }

            // 渲染调用栈
            var html = '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">';
            html += '<div style="font-size:0.8rem;color:#666;margin-bottom:8px;">调用栈（从上到下为从新到旧）</div>';

            for (var i = stack.length - 1; i >= 0; i--) {
                var call = stack[i];
                var isActive = (i === 0);

                html += '<div class="stack-frame ' + (isActive ? 'active' : '') + '" style="width:auto;min-width:120px;">';
                html += '<div class="func-name">fibonacci</div>';
                html += '<div class="param">n = ' + call.n + '</div>';
                html += '</div>';

                if (i > 0) {
                    html += '<div class="stack-arrow">↓</div>';
                }
            }

            html += '<div class="stack-bottom">栈底</div>';
            html += '</div>';

            container.innerHTML = html;
        }

        function renderReverse(state) {
            var container = document.getElementById("visualArea");
            container.innerHTML = "";

            var stack = state.stack || [];

            if (state.phase === "done" || stack.length === 0) {
                if (state.returnValue !== null) {
                    container.innerHTML = '<div class="tree-node">' +
                        '<div style="font-size:1.2rem;font-family:var(--font-mono);color:#2e7d32;font-weight:700;">"' + state.returnValue + '"</div>' +
                        '<div style="margin-top:12px;font-size:0.9rem;color:#666;">递归完成</div>' +
                        '</div>';
                } else {
                    container.innerHTML = '<div style="color:#999;padding:40px;">等待开始...</div>';
                }
                return;
            }

            // 渲染栈帧
            var html = '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">';

            for (var i = 0; i < stack.length; i++) {
                var call = stack[i];
                var isActive = (i === stack.length - 1);

                html += '<div class="stack-frame ' + (isActive ? 'active' : '') + '">';
                html += '<div class="func-name">reverse</div>';
                html += '<div class="param">"' + call.str + '"</div>';
                html += '</div>';

                if (i < stack.length - 1) {
                    html += '<div class="stack-arrow">↓</div>';
                }
            }

            html += '<div class="stack-bottom">栈底</div>';
            html += '</div>';

            container.innerHTML = html;
        }

        function render(state) {
            var dataDisplay = document.getElementById("dataDisplay");

            if (state.type === "factorial") {
                renderFactorial(state);
                var result = state.returnValue !== null ? " = " + state.returnValue : "";
                dataDisplay.textContent = "factorial(" + state.n + ")" + result;
            } else if (state.type === "fibonacci") {
                renderFibonacci(state);
                if (state.returnValues && state.returnValues["root"] !== undefined) {
                    dataDisplay.textContent = "fibonacci(" + state.n + ") = " + state.returnValues["root"];
                } else {
                    dataDisplay.textContent = "fibonacci(" + state.n + ")";
                }
            } else if (state.type === "reverse") {
                renderReverse(state);
                var result = state.returnValue !== null ? " = \"" + state.returnValue + "\"" : "";
                dataDisplay.textContent = "reverse(\"" + state.s + "\")" + result;
            }

            // 更新步骤信息
            var stepInfo = stepManager.getStepInfo();
            document.getElementById("stepDescription").textContent = stepInfo.description;

            var whyText = document.getElementById("whyText");
            var nextText = document.getElementById("nextText");

            if (stepInfo.why) {
                document.getElementById("whyBox").style.display = "block";
                whyText.textContent = stepInfo.why;
            } else {
                document.getElementById("whyBox").style.display = "none";
            }

            if (stepInfo.next) {
                document.getElementById("nextBox").style.display = "block";
                nextText.textContent = stepInfo.next;
            } else {
                document.getElementById("nextBox").style.display = "none";
            }

            // 更新调用栈显示
            var stackDisplay = document.getElementById("stackDisplay");
            if (state.stack && state.stack.length > 0) {
                var stackItems = state.stack.map(function(item) {
                    if (state.type === "factorial") {
                        return "factorial(" + item + ")";
                    } else if (state.type === "fibonacci") {
                        return "fib(" + item.n + ")";
                    } else if (state.type === "reverse") {
                        return "reverse(\"" + item.str + "\")";
                    }
                    return "";
                });
                stackDisplay.innerHTML = stackItems.join("<br>") + "<br><span style='color:#999'>↑ 栈顶</span>";
            } else {
                stackDisplay.textContent = "栈为空";
            }
        }

        // ============================================================================
        // 初始化和事件处理
        // ============================================================================

        function init(operation) {
            currentOperation = operation;
            var value = parseInt(document.getElementById("valueInput").value) || 4;

            // 限制输入范围
            if (operation === "fibonacci") {
                value = Math.min(Math.max(value, 1), 8);
            } else {
                value = Math.min(Math.max(value, 1), 10);
            }

            switch (operation) {
                case "factorial":
                    steps = generateFactorialSteps(value);
                    break;
                case "fibonacci":
                    steps = generateFibonacciSteps(value);
                    break;
                case "reverse":
                    var testStr = value <= 4 ? "hello" : (value <= 6 ? "Python" : "recursion");
                    steps = generateReverseSteps(testStr);
                    break;
            }

            stepManager = createStepManager(steps, render);
            stepManager.render();

            updateButtons();
        }

        function updateButtons() {
            var btnPrev = document.getElementById("btnPrev");
            var btnNext = document.getElementById("btnNext");
            var stepIndicator = document.getElementById("stepIndicator");

            if (btnPrev) btnPrev.disabled = !stepManager.hasPrev();
            if (btnNext) btnNext.disabled = !stepManager.hasNext();

            if (stepIndicator && stepManager) {
                var curr = stepManager.getCurrentStep() + 1;
                var total = stepManager.getTotalSteps();
                stepIndicator.textContent = "步骤 " + curr + " / " + total;
            }
        }

        // 页面加载完成后初始化
        window.addEventListener("DOMContentLoaded", function() {
            // 创建按钮
            var buttonRow = document.getElementById("buttonRow");
            buttonRow.innerHTML =
                '<button class="btn btn-secondary" id="btnPrev" disabled>← 上一步</button>' +
                '<span class="step-indicator" id="stepIndicator">步骤 1 / 1</span>' +
                '<button class="btn btn-primary" id="btnNext" disabled>下一步 →</button>' +
                '<button class="btn btn-secondary" id="btnReset">重置</button>';

            // 绑定操作标签
            var opTabs = document.querySelectorAll(".op-tab");
            opTabs.forEach(function(tab) {
                tab.addEventListener("click", function() {
                    opTabs.forEach(function(t) { t.classList.remove("active"); });
                    tab.classList.add("active");
                    init(tab.getAttribute("data-op"));
                });
            });

            // 绑定按钮事件
            document.getElementById("btnPrev").addEventListener("click", function() {
                stepManager.prev();
                updateButtons();
            });

            document.getElementById("btnNext").addEventListener("click", function() {
                stepManager.next();
                updateButtons();
            });

            document.getElementById("btnReset").addEventListener("click", function() {
                init(currentOperation);
            });

            document.getElementById("restartBtn").addEventListener("click", function() {
                init(currentOperation);
            });

            // 初始加载
            var activeTab = document.querySelector(".op-tab.active");
            var initialOp = activeTab ? activeTab.getAttribute("data-op") : "factorial";
            init(initialOp);
        });
    </script>
</body>
</html>
