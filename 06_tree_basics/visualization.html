    <script>
        // ============================================================================
        // 全局状态
        // ============================================================================

        var currentOperation = "preorder";
        var steps = [];
        var stepManager = null;

        // 树结构定义
        var tree = {
            value: 1,
            left: {
                value: 2,
                left: { value: 4, left: null, right: null },
                right: { value: 5, left: null, right: null }
            },
            right: {
                value: 3,
                left: null,
                right: { value: 6, left: null, right: null }
            }
        };

        // 树的节点位置 (x, y) 和父子关系
        var nodeRadius = 25;
        var treeLayout = {
            1: { x: 200, y: 50, parent: null, side: null },
            2: { x: 100, y: 150, parent: 1, side: 'left' },
            3: { x: 300, y: 150, parent: 1, side: 'right' },
            4: { x: 50, y: 250, parent: 2, side: 'left' },
            5: { x: 150, y: 250, parent: 2, side: 'right' },
            6: { x: 350, y: 250, parent: 3, side: 'right' }
        };

        // 连接线定义 (从父节点到子节点)
        var treeEdges = [
            { from: 1, to: 2 },
            { from: 1, to: 3 },
            { from: 2, to: 4 },
            { from: 2, to: 5 },
            { from: 3, to: 6 }
        ];

        // ============================================================================
        // 步骤生成
        // ============================================================================

        function generatePreorderSteps(node) {
            var steps = [];
            var result = [];

            function traverse(n, depth, callStack) {
                if (n === null) {
                    steps.push({
                        state: {
                            type: "preorder",
                            phase: "null",
                            visited: result.slice(),
                            current: null,
                            callStack: callStack.slice(),
                            result: result.join(" ")
                        },
                        description: `节点为空，返回`,
                        why: `空节点不需要遍历，直接返回`,
                        next: `返回上层继续`
                    });
                    return;
                }

                callStack.push(n.value);

                // 访问当前节点（根）
                steps.push({
                    state: {
                        type: "preorder",
                        phase: "visit",
                        visited: result.slice(),
                        current: n.value,
                        callStack: callStack.slice(),
                        result: result.join(" ")
                    },
                    description: `访问节点 ${n.value}（根）`,
                    why: `前序遍历：先访问根节点`,
                    next: `继续遍历左子树`
                });

                result.push(n.value);

                steps.push({
                    state: {
                        type: "preorder",
                        phase: "added",
                        visited: result.slice(),
                        current: n.value,
                        callStack: callStack.slice(),
                        result: result.join(" ")
                    },
                    description: `将 ${n.value} 加入结果，当前结果：[${result.join(", ")}]`,
                    why: `根节点已访问，加入遍历结果`,
                    next: `递归遍历左子树`
                });

                // 遍历左子树
                steps.push({
                    state: {
                        type: "preorder",
                        phase: "toLeft",
                        visited: result.slice(),
                        current: n.value,
                        callStack: callStack.slice(),
                        result: result.join(" ")
                    },
                    description: `递归遍历节点 ${n.value} 的左子树`,
                    why: `前序遍历：根 → 左 → 右`,
                    next: `进入左子树`
                });

                traverse(n.left, depth + 1, callStack);

                // 遍历右子树
                steps.push({
                    state: {
                        type: "preorder",
                        phase: "toRight",
                        visited: result.slice(),
                        current: n.value,
                        callStack: callStack.slice(),
                        result: result.join(" ")
                    },
                    description: `递归遍历节点 ${n.value} 的右子树`,
                    why: `左子树遍历完成，现在遍历右子树`,
                    next: `进入右子树`
                });

                traverse(n.right, depth + 1, callStack);

                callStack.pop();

                steps.push({
                    state: {
                        type: "preorder",
                        phase: "return",
                        visited: result.slice(),
                        current: n.value,
                        callStack: callStack.slice(),
                        result: result.join(" ")
                    },
                    description: `节点 ${n.value} 的左右子树遍历完成，返回`,
                    why: `该节点的遍历任务已完成`,
                    next: `返回上层`
                });
            }

            steps.push({
                state: {
                    type: "preorder",
                    phase: "start",
                    visited: [],
                    current: null,
                    callStack: [],
                    result: ""
                },
                description: `开始前序遍历二叉树`,
                why: `前序：根 → 左 → 右，先访问根节点`,
                next: `访问根节点 1`
            });

            traverse(tree, 0, []);

            steps.push({
                state: {
                    type: "preorder",
                    phase: "done",
                    visited: result.slice(),
                    current: null,
                    callStack: [],
                    result: result.join(" ")
                },
                description: `遍历完成！结果：[${result.join(", ")}]`,
                why: `所有节点都已遍历`,
                next: null
            });

            return steps;
        }

        function generateInorderSteps(node) {
            var steps = [];
            var result = [];

            function traverse(n, depth, callStack) {
                if (n === null) {
                    steps.push({
                        state: {
                            type: "inorder",
                            phase: "null",
                            visited: result.slice(),
                            current: null,
                            callStack: callStack.slice(),
                            result: result.join(" ")
                        },
                        description: `节点为空，返回`,
                        why: `空节点不需要遍历，直接返回`,
                        next: `返回上层继续`
                    });
                    return;
                }

                callStack.push(n.value);

                // 遍历左子树
                steps.push({
                    state: {
                        type: "inorder",
                        phase: "toLeft",
                        visited: result.slice(),
                        current: n.value,
                        callStack: callStack.slice(),
                        result: result.join(" ")
                    },
                    description: `递归遍历节点 ${n.value} 的左子树`,
                    why: `中序遍历：左 → 根 → 右，先遍历左子树`,
                    next: `进入左子树`
                });

                traverse(n.left, depth + 1, callStack);

                // 访问当前节点（根）
                steps.push({
                    state: {
                        type: "inorder",
                        phase: "visit",
                        visited: result.slice(),
                        current: n.value,
                        callStack: callStack.slice(),
                        result: result.join(" ")
                    },
                    description: `访问节点 ${n.value}（根）`,
                    why: `左子树遍历完成，现在访问根节点`,
                    next: `继续遍历右子树`
                });

                result.push(n.value);

                steps.push({
                    state: {
                        type: "inorder",
                        phase: "added",
                        visited: result.slice(),
                        current: n.value,
                        callStack: callStack.slice(),
                        result: result.join(" ")
                    },
                    description: `将 ${n.value} 加入结果，当前结果：[${result.join(", ")}]`,
                    why: `根节点已访问，加入遍历结果`,
                    next: `递归遍历右子树`
                });

                // 遍历右子树
                steps.push({
                    state: {
                        type: "inorder",
                        phase: "toRight",
                        visited: result.slice(),
                        current: n.value,
                        callStack: callStack.slice(),
                        result: result.join(" ")
                    },
                    description: `递归遍历节点 ${n.value} 的右子树`,
                    why: `根节点已访问，现在遍历右子树`,
                    next: `进入右子树`
                });

                traverse(n.right, depth + 1, callStack);

                callStack.pop();

                steps.push({
                    state: {
                        type: "inorder",
                        phase: "return",
                        visited: result.slice(),
                        current: n.value,
                        callStack: callStack.slice(),
                        result: result.join(" ")
                    },
                    description: `节点 ${n.value} 的左右子树遍历完成，返回`,
                    why: `该节点的遍历任务已完成`,
                    next: `返回上层`
                });
            }

            steps.push({
                state: {
                    type: "inorder",
                    phase: "start",
                    visited: [],
                    current: null,
                    callStack: [],
                    result: ""
                },
                description: `开始中序遍历二叉树`,
                why: `中序：左 → 根 → 右，先遍历左子树`,
                next: `进入左子树`
            });

            traverse(tree, 0, []);

            steps.push({
                state: {
                    type: "inorder",
                    phase: "done",
                    visited: result.slice(),
                    current: null,
                    callStack: [],
                    result: result.join(" ")
                },
                description: `遍历完成！结果：[${result.join(", ")}]`,
                why: `所有节点都已遍历`,
                next: null
            });

            return steps;
        }

        function generatePostorderSteps(node) {
            var steps = [];
            var result = [];

            function traverse(n, depth, callStack) {
                if (n === null) {
                    steps.push({
                        state: {
                            type: "postorder",
                            phase: "null",
                            visited: result.slice(),
                            current: null,
                            callStack: callStack.slice(),
                            result: result.join(" ")
                        },
                        description: `节点为空，返回`,
                        why: `空节点不需要遍历，直接返回`,
                        next: `返回上层继续`
                    });
                    return;
                }

                callStack.push(n.value);

                // 遍历左子树
                steps.push({
                    state: {
                        type: "postorder",
                        phase: "toLeft",
                        visited: result.slice(),
                        current: n.value,
                        callStack: callStack.slice(),
                        result: result.join(" ")
                    },
                    description: `递归遍历节点 ${n.value} 的左子树`,
                    why: `后序遍历：左 → 右 → 根，先遍历左子树`,
                    next: `进入左子树`
                });

                traverse(n.left, depth + 1, callStack);

                // 遍历右子树
                steps.push({
                    state: {
                        type: "postorder",
                        phase: "toRight",
                        visited: result.slice(),
                        current: n.value,
                        callStack: callStack.slice(),
                        result: result.join(" ")
                    },
                    description: `递归遍历节点 ${n.value} 的右子树`,
                    why: `左子树遍历完成，现在遍历右子树`,
                    next: `进入右子树`
                });

                traverse(n.right, depth + 1, callStack);

                // 访问当前节点（根）
                steps.push({
                    state: {
                        type: "postorder",
                        phase: "visit",
                        visited: result.slice(),
                        current: n.value,
                        callStack: callStack.slice(),
                        result: result.join(" ")
                    },
                    description: `访问节点 ${n.value}（根）`,
                    why: `左右子树都遍历完成，现在访问根节点`,
                    next: `将节点加入结果`
                });

                result.push(n.value);

                steps.push({
                    state: {
                        type: "postorder",
                        phase: "added",
                        visited: result.slice(),
                        current: n.value,
                        callStack: callStack.slice(),
                        result: result.join(" ")
                    },
                    description: `将 ${n.value} 加入结果，当前结果：[${result.join(", ")}]`,
                    why: `根节点已访问，加入遍历结果`,
                    next: `返回上层`
                });

                callStack.pop();

                steps.push({
                    state: {
                        type: "postorder",
                        phase: "return",
                        visited: result.slice(),
                        current: n.value,
                        callStack: callStack.slice(),
                        result: result.join(" ")
                    },
                    description: `节点 ${n.value} 遍历完成，返回`,
                    why: `该节点的遍历任务已完成`,
                    next: `返回上层`
                });
            }

            steps.push({
                state: {
                    type: "postorder",
                    phase: "start",
                    visited: [],
                    current: null,
                    callStack: [],
                    result: ""
                },
                description: `开始后序遍历二叉树`,
                why: `后序：左 → 右 → 根，先遍历左子树`,
                next: `进入左子树`
            });

            traverse(tree, 0, []);

            steps.push({
                state: {
                    type: "postorder",
                    phase: "done",
                    visited: result.slice(),
                    current: null,
                    callStack: [],
                    result: result.join(" ")
                },
                description: `遍历完成！结果：[${result.join(", ")}]`,
                why: `所有节点都已遍历`,
                next: null
            });

            return steps;
        }

        // ============================================================================
        // 渲染函数
        // ============================================================================

        function renderTree(state) {
            var svg = document.getElementById("treeSvg");
            var visited = state.visited || [];
            var current = state.current;

            var html = '';

            // 绘制连接线
            for (var i = 0; i < treeEdges.length; i++) {
                var edge = treeEdges[i];
                var fromPos = treeLayout[edge.from];
                var toPos = treeLayout[edge.to];
                var edgeId = 'edge-' + edge.from + '-' + edge.to;

                // 线条从父节点底部画到子节点顶部
                var x1 = fromPos.x;
                var y1 = fromPos.y + nodeRadius;
                var x2 = toPos.x;
                var y2 = toPos.y - nodeRadius;

                // 检查这条边是否与当前访问相关
                var isActive = (current === edge.from || current === edge.to);

                html += '<line id="' + edgeId + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" ' +
                    'stroke="' + (isActive ? '#e53935' : '#ccc') + '" stroke-width="' + (isActive ? '3' : '2') + '" />';
            }

            // 绘制节点
            for (var key in treeLayout) {
                var pos = treeLayout[key];
                var nodeValue = parseInt(key);
                var isCurrent = (current === nodeValue);
                var isVisited = visited.includes(nodeValue);

                var cls = 'tree-node-box';
                if (isCurrent) cls += ' current';
                else if (isVisited) cls += ' visited';

                html += '<g class="tree-node-g" id="node-g-' + key + '">';
                html += '<circle cx="' + pos.x + '" cy="' + pos.y + '" r="' + nodeRadius + '" class="' + cls + '" />';
                html += '<text x="' + pos.x + '" y="' + pos.y + '" class="tree-node-text">' + key + '</text>';
                html += '</g>';
            }

            svg.innerHTML = html;
        }

        function renderStack(state) {
            var container = document.getElementById("stackDisplay");
            var stack = state.callStack || [];

            if (stack.length === 0) {
                container.innerHTML = '<div style="color:#999;padding:20px;">栈为空</div>';
                return;
            }

            var html = '<div style="display:flex;flex-direction:column;align-items:center;gap:2px;">';

            for (var i = 0; i < stack.length; i++) {
                var val = stack[i];
                var isActive = (i === stack.length - 1);

                html += '<div class="stack-frame ' + (isActive ? 'active' : '') + '">';
                html += '<div>node(' + val + ')</div>';
                html += '</div>';

                if (i < stack.length - 1) {
                    html += '<div class="stack-arrow">↓</div>';
                }
            }

            html += '<div style="margin-top:8px;font-size:0.75rem;color:#999;">← 栈底</div>';
            html += '</div>';

            container.innerHTML = html;
        }

        function render(state) {
            renderTree(state);
            renderStack(state);

            // 更新结果
            var resultValue = document.getElementById("resultValue");
            if (state.result === "") {
                resultValue.innerHTML = "等待开始...";
            } else {
                var values = state.result.split(" ");
                var html = "";
                for (var i = 0; i < values.length; i++) {
                    if (i > 0) html += " → ";
                    if (i === values.length - 1 && state.phase !== "done") {
                        html += '<span class="current">' + values[i] + '</span>';
                    } else {
                        html += values[i];
                    }
                }
                resultValue.innerHTML = html;
            }

            // 更新步骤信息
            var stepInfo = stepManager.getStepInfo();
            document.getElementById("stepDescription").textContent = stepInfo.description;

            var whyText = document.getElementById("whyText");
            var nextText = document.getElementById("nextText");

            if (stepInfo.why) {
                document.getElementById("whyBox").style.display = "block";
                whyText.textContent = stepInfo.why;
            } else {
                document.getElementById("whyBox").style.display = "none";
            }

            if (stepInfo.next) {
                document.getElementById("nextBox").style.display = "block";
                nextText.textContent = stepInfo.next;
            } else {
                document.getElementById("nextBox").style.display = "none";
            }
        }

        // ============================================================================
        // 初始化和事件处理
        // ============================================================================

        function init(operation) {
            currentOperation = operation;

            switch (operation) {
                case "preorder":
                    steps = generatePreorderSteps(tree);
                    document.getElementById("orderHint").innerHTML =
                        '<span class="order-hint-item"><strong>前序：</strong>根 → 左 → 右</span>';
                    break;
                case "inorder":
                    steps = generateInorderSteps(tree);
                    document.getElementById("orderHint").innerHTML =
                        '<span class="order-hint-item"><strong>中序：</strong>左 → 根 → 右</span>';
                    break;
                case "postorder":
                    steps = generatePostorderSteps(tree);
                    document.getElementById("orderHint").innerHTML =
                        '<span class="order-hint-item"><strong>后序：</strong>左 → 右 → 根</span>';
                    break;
            }

            stepManager = createStepManager(steps, render);
            stepManager.render();

            updateButtons();
        }

        function updateButtons() {
            var btnPrev = document.getElementById("btnPrev");
            var btnNext = document.getElementById("btnNext");
            var stepIndicator = document.getElementById("stepIndicator");

            if (btnPrev) btnPrev.disabled = !stepManager.hasPrev();
            if (btnNext) btnNext.disabled = !stepManager.hasNext();

            if (stepIndicator && stepManager) {
                var curr = stepManager.getCurrentStep() + 1;
                var total = stepManager.getTotalSteps();
                stepIndicator.textContent = "步骤 " + curr + " / " + total;
            }
        }

        // 页面加载完成后初始化
        window.addEventListener("DOMContentLoaded", function() {
            // 创建按钮
            var buttonRow = document.getElementById("buttonRow");
            buttonRow.innerHTML =
                '<button class="btn btn-secondary" id="btnPrev" disabled>← 上一步</button>' +
                '<span class="step-indicator" id="stepIndicator">步骤 1 / 1</span>' +
                '<button class="btn btn-primary" id="btnNext" disabled>下一步 →</button>' +
                '<button class="btn btn-secondary" id="btnReset">重置</button>';

            // 绑定操作标签
            var opTabs = document.querySelectorAll(".op-tab");
            opTabs.forEach(function(tab) {
                tab.addEventListener("click", function() {
                    opTabs.forEach(function(t) { t.classList.remove("active"); });
                    tab.classList.add("active");
                    init(tab.getAttribute("data-op"));
                });
            });

            // 绑定按钮事件
            document.getElementById("btnPrev").addEventListener("click", function() {
                stepManager.prev();
                updateButtons();
            });

            document.getElementById("btnNext").addEventListener("click", function() {
                stepManager.next();
                updateButtons();
            });

            document.getElementById("btnReset").addEventListener("click", function() {
                init(currentOperation);
            });

            // 初始加载
            var activeTab = document.querySelector(".op-tab.active");
            var initialOp = activeTab ? activeTab.getAttribute("data-op") : "preorder";
            init(initialOp);
        });
    </script>
</body>
</html>
