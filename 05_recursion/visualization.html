    <script src="../shared/utils.js"></script>
    <script>
        // ============================================================================
        // 全局状态
        // ============================================================================

        var currentOperation = "factorial";
        var steps = [];
        var stepManager = null;

        // ============================================================================
        // 阶乘步骤生成
        // ============================================================================

        function generateFactorialSteps(n) {
            var steps = [];
            var stack = [];

            // 初始状态
            steps.push({
                state: {
                    type: "factorial",
                    n: n,
                    phase: "start",
                    stack: [],
                    currentNode: null,
                    returnValue: null
                },
                description: "阶乘 factorial(" + n + ")",
                why: "递归需要明确输入值",
                next: "开始递归调用"
            });

            // 生成递归调用步骤
            function addCallSteps(n, depth, parentReturn) {
                stack.push(n);
                var callStack = stack.slice();

                // 调用当前节点
                steps.push({
                    state: {
                        type: "factorial",
                        n: n,
                        phase: "call",
                        stack: callStack,
                        currentNode: n,
                        depth: depth,
                        returnValue: null
                    },
                    description: "调用 factorial(" + n + ")",
                    why: "压栈：为 factorial(" + n + ") 分配栈帧",
                    next: n > 1 ? "递归调用 factorial(" + (n - 1) + ")" : "到达终止条件，返回 1"
                });

                if (n <= 1) {
                    // 终止条件返回
                    stack.pop();
                    steps.push({
                        state: {
                            type: "factorial",
                            n: n,
                            phase: "return",
                            stack: stack.slice(),
                            currentNode: n,
                            depth: depth,
                            returnValue: 1
                        },
                        description: "factorial(" + n + ") = 1，返回",
                        why: "终止条件：n <= 1 时返回 1",
                        next: parentReturn !== null ? "继续返回" : "递归结束"
                    });
                    return 1;
                } else {
                    var childReturn = addCallSteps(n - 1, depth + 1, n);
                    var result = n * childReturn;

                    stack.pop();
                    steps.push({
                        state: {
                            type: "factorial",
                            n: n,
                            phase: "compute",
                            stack: stack.slice(),
                            currentNode: n,
                            depth: depth,
                            returnValue: result,
                            childReturn: childReturn
                        },
                        description: n + " × " + childReturn + " = " + result + "，返回",
                        why: "弹栈：factorial(" + n + ") 计算完成，返回 " + result,
                        next: parentReturn !== null ? "继续返回" : "递归结束"
                    });
                    return result;
                }
            }

            addCallSteps(n, 0, null);

            // 最终结果
            var finalResult = 1;
            for (var i = 2; i <= n; i++) finalResult *= i;

            steps.push({
                state: {
                    type: "factorial",
                    n: n,
                    phase: "done",
                    stack: [],
                    currentNode: null,
                    returnValue: finalResult
                },
                description: "递归完成！factorial(" + n + ") = " + finalResult,
                why: "所有栈帧都已弹栈，递归调用链结束",
                next: null
            });

            return steps;
        }

        // ============================================================================
        // 斐波那契步骤生成
        // ============================================================================

        // ============================================================================
        // 斐波那契递归树步骤生成
        // ============================================================================

        // 构建斐波那契树结构的辅助函数
        function buildFibTreeStructure(n, path) {
            return {
                value: n,
                path: path,
                status: "pending", // pending | computing | returning | done
                result: null,
                left: null,
                right: null
            };
        }

        // 深拷贝树结构
        function cloneFibTree(node) {
            if (!node) return null;
            var clone = {
                value: node.value,
                path: node.path,
                status: node.status,
                result: node.result,
                left: node.left ? cloneFibTree(node.left) : null,
                right: node.right ? cloneFibTree(node.right) : null
            };
            return clone;
        }

        // 查找树中对应路径的节点
        function findNodeByPath(root, path) {
            if (!root) return null;
            if (root.path === path) return root;
            if (root.left) {
                var found = findNodeByPath(root.left, path);
                if (found) return found;
            }
            if (root.right) {
                var found = findNodeByPath(root.right, path);
                if (found) return found;
            }
            return null;
        }

        // 标记路径上所有节点为某个状态
        function markPathToRoot(root, path, status) {
            var parts = path.split("-");
            var current = root;
            for (var i = 0; i < parts.length; i++) {
                if (current) {
                    if (parts[i] === "L") {
                        current = current.left;
                    } else if (parts[i] === "R") {
                        current = current.right;
                    }
                }
            }
            // 向上回溯标记
            var node = findNodeByPath(root, path);
            if (node) {
                node.status = status;
            }
        }

        function generateFibonacciSteps(n) {
            var steps = [];
            var root = buildFibTreeStructure(n, "root");
            var returnValues = {}; // path -> result

            // 初始状态 - 展示完整但未展开的树
            root.status = "computing";
            steps.push({
                state: {
                    type: "fibonacci",
                    n: n,
                    phase: "start",
                    tree: cloneFibTree(root),
                    returnValues: {},
                    description: "fibonacci(" + n + ")",
                    why: "斐波那契数列定义：fib(n) = fib(n-1) + fib(n-2)",
                    next: "递归展开 fib(" + n + ")"
                }
            });

            // 递归生成步骤
            function buildFibSteps(node) {
                if (!node) return;

                // 当前节点开始计算
                node.status = "computing";
                steps.push({
                    state: {
                        type: "fibonacci",
                        n: n,
                        phase: "call",
                        tree: cloneFibTree(root),
                        returnValues: Object.assign({}, returnValues),
                        activePath: node.path,
                        description: "调用 fib(" + node.value + ")",
                        why: "展开递归树，计算 fib(" + node.value + ")",
                        next: node.value > 1 ? "继续展开左子树 fib(" + (node.value - 1) + ")" : "到达终止条件"
                    }
                });

                // 终止条件
                if (node.value <= 1) {
                    node.status = "done";
                    node.result = node.value;
                    returnValues[node.path] = node.value;

                    steps.push({
                        state: {
                            type: "fibonacci",
                            n: n,
                            phase: "return-base",
                            tree: cloneFibTree(root),
                            returnValues: Object.assign({}, returnValues),
                            activePath: node.path,
                            description: "fib(" + node.value + ") = " + node.value + " (终止条件)",
                            why: "fib(0)=0, fib(1)=1 是递归终止条件",
                            next: "返回上层"
                        }
                    });
                    return;
                }

                // 创建子节点
                node.left = buildFibTreeStructure(node.value - 1, node.path + "-L");
                node.right = buildFibTreeStructure(node.value - 2, node.path + "-R");

                // 递归左子树
                buildFibSteps(node.left);

                // 左子树完成后，标记返回状态
                node.left.status = "returning";
                steps.push({
                    state: {
                        type: "fibonacci",
                        n: n,
                        phase: "after-left",
                        tree: cloneFibTree(root),
                        returnValues: Object.assign({}, returnValues),
                        activePath: node.path,
                        leftResult: node.left.result,
                        description: "fib(" + node.value + ") 收到左子节点：fib(" + node.left.value + ") = " + node.left.result,
                        why: "左子树计算完成，等待右子树",
                        next: "展开右子树 fib(" + (node.value - 2) + ")"
                    }
                });

                // 递归右子树
                buildFibSteps(node.right);

                // 右子树完成后，计算并返回
                node.right.status = "returning";
                var leftVal = node.left.result;
                var rightVal = node.right.result;
                var result = leftVal + rightVal;
                node.result = result;
                node.status = "done";
                returnValues[node.path] = result;

                steps.push({
                    state: {
                        type: "fibonacci",
                        n: n,
                        phase: "compute",
                        tree: cloneFibTree(root),
                        returnValues: Object.assign({}, returnValues),
                        activePath: node.path,
                        leftResult: leftVal,
                        rightResult: rightVal,
                        description: "fib(" + node.value + ") = fib(" + node.left.value + ") + fib(" + node.right.value + ") = " + leftVal + " + " + rightVal + " = " + result,
                        why: "左右子树都计算完成，合并结果",
                        next: "返回上层"
                    }
                });
            }

            buildFibSteps(root);

            // 最终状态
            steps.push({
                state: {
                    type: "fibonacci",
                    n: n,
                    phase: "done",
                    tree: cloneFibTree(root),
                    returnValues: Object.assign({}, returnValues),
                    description: "递归完成！fibonacci(" + n + ") = " + root.result,
                    why: "所有递归调用都已完成",
                    next: null
                }
            });

            return steps;
        }

        // ============================================================================
        // 字符串反转步骤生成
        // ============================================================================

        function generateReverseSteps(s) {
            var steps = [];
            var stack = [];

            steps.push({
                state: {
                    type: "reverse",
                    s: s,
                    phase: "start",
                    stack: [],
                    currentStr: s,
                    returnValue: null
                },
                description: "反转字符串 \"" + s + "\"",
                why: "字符串反转用递归：s = s[-1] + reverse(s[:-1])",
                next: "开始递归调用"
            });

            function reverseRecursive(str, depth) {
                stack.push({str: str, depth: depth});

                steps.push({
                    state: {
                        type: "reverse",
                        s: s,
                        phase: "call",
                        stack: stack.slice(),
                        currentStr: str,
                        depth: depth,
                        returnValue: null
                    },
                    description: "reverse(\"" + str + "\")",
                    why: "压栈：需要处理 \"" + str + "\"",
                    next: str.length > 1 ? "递归调用 reverse(\"" + str.slice(0, -1) + "\")" : "到达终止条件"
                });

                if (str.length <= 1) {
                    stack.pop();
                    steps.push({
                        state: {
                            type: "reverse",
                            s: s,
                            phase: "return-base",
                            stack: stack.slice(),
                            currentStr: str,
                            depth: depth,
                            returnValue: str
                        },
                        description: "reverse(\"" + str + "\") = \"" + str + "\"（单字符，返回）",
                        why: "终止条件：单字符直接返回",
                        next: "返回上层"
                    });
                    return str;
                }

                var childResult = reverseRecursive(str.slice(0, -1), depth + 1);
                var result = str[str.length - 1] + childResult;

                stack.pop();
                steps.push({
                    state: {
                        type: "reverse",
                        s: s,
                        phase: "compute",
                        stack: stack.slice(),
                        currentStr: str,
                        depth: depth,
                        returnValue: result,
                        childResult: childResult,
                        char: str[str.length - 1]
                    },
                    description: "\"" + str[str.length - 1] + "\" + \"" + childResult + "\" = \"" + result + "\"",
                    why: "组合：最后一个字符 + 前面反转结果",
                    next: "返回上层"
                });

                return result;
            }

            reverseRecursive(s, 0);

            var finalResult = s.split('').reverse().join('');

            steps.push({
                state: {
                    type: "reverse",
                    s: s,
                    phase: "done",
                    stack: [],
                    currentStr: s,
                    returnValue: finalResult
                },
                description: "递归完成！reverse(\"" + s + "\") = \"" + finalResult + "\"",
                why: "所有栈帧都已弹栈",
                next: null
            });

            return steps;
        }

        // ============================================================================
        // 渲染函数
        // ============================================================================

        function renderFactorial(state) {
            var container = document.getElementById("visualArea");
            container.innerHTML = "";

            var stack = state.stack || [];

            if (state.phase === "done" || stack.length === 0) {
                if (state.returnValue !== null) {
                    container.innerHTML = '<div class="tree-node">' +
                        '<div class="tree-node-box done">' + state.returnValue + '</div>' +
                        '<div style="margin-top:12px;font-size:0.9rem;color:#666;">递归完成</div>' +
                        '</div>';
                } else {
                    container.innerHTML = '<div style="color:#999;padding:40px;">等待开始...</div>';
                }
                return;
            }

            // 渲染栈帧 - 栈顶在上,栈底在下(倒序遍历)
            var html = '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">';
            html += '<div class="stack-top-label">↑ 栈顶（最新调用）</div>';

            for (var i = stack.length - 1; i >= 0; i--) {
                var n = stack[i];
                var isActive = (i === stack.length - 1) && (state.phase === "call" || state.phase === "compute");
                var isReturning = state.phase === "return" || (state.phase === "compute" && i === stack.length - 1);

                html += '<div class="stack-frame ' + (isActive ? 'active' : '') + ' ' + (isReturning ? 'returning' : '') + '">';
                html += '<div class="func-name">factorial</div>';
                html += '<div class="param">n = ' + n + '</div>';

                if (isReturning && state.returnValue !== null) {
                    html += '<div class="return-value">→ ' + state.returnValue + '</div>';
                } else if (isActive && state.phase === "compute" && state.childReturn !== undefined) {
                    html += '<div class="return-value">← ' + state.childReturn + '</div>';
                }

                html += '</div>';

                if (i > 0) {
                    html += '<div class="stack-arrow">↑</div>';
                }
            }

            html += '<div class="stack-bottom-label">栈底</div>';
            html += '</div>';

            container.innerHTML = html;
        }

        function renderFibonacci(state) {
            var container = document.getElementById("visualArea");
            container.innerHTML = "";

            if (!state.tree) {
                container.innerHTML = '<div style="color:#999;padding:40px;">等待开始...</div>';
                return;
            }

            if (state.phase === "done") {
                container.innerHTML = '<div class="tree-node" style="padding:40px;">' +
                    '<div class="tree-node-box done" style="width:100px;height:100px;font-size:2rem;">' + state.tree.result + '</div>' +
                    '<div style="margin-top:16px;font-size:1.1rem;color:#666;">递归完成</div>' +
                    '<div style="margin-top:8px;font-size:0.9rem;color:#999;">fib(' + state.n + ') = ' + state.tree.result + '</div>' +
                    '</div>';
                return;
            }

            // 使用SVG绘制递归树
            var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("id", "fibTreeSvg");
            svg.setAttribute("style", "width:100%;height:320px;");
            svg.setAttribute("preserveAspectRatio", "xMidYMin meet");

            // 计算树的节点位置
            var nodePositions = {}; // path -> {x, y}
            var tree = state.tree;
            var treeHeight = getTreeHeight(tree);
            var levelHeight = 55;
            var nodeRadius = 24;

            // 计算每个节点的位置（使用更紧凑的布局）
            var containerWidth = container.clientWidth || 600;
            // 每层需要的位置数：第d层最多有 Math.pow(2, d) 个节点
            // 但实际树不是完美二叉树，所以用实际节点数来计算间距
            var levelNodeCounts = {};
            var maxNodesAtLevel = 0;
            var maxLevel = 0;

            function countNodesAtLevels(node, depth) {
                if (!node) return;
                levelNodeCounts[depth] = (levelNodeCounts[depth] || 0) + 1;
                maxLevel = Math.max(maxLevel, depth);
                maxNodesAtLevel = Math.max(maxNodesAtLevel, levelNodeCounts[depth]);
                countNodesAtLevels(node.left, depth + 1);
                countNodesAtLevels(node.right, depth + 1);
            }
            countNodesAtLevels(tree, 0);

            // 使用实际宽度，根据节点数动态计算间距
            var minSpacing = 50; // 最小节点间距
            var baseWidth = Math.max(containerWidth, maxNodesAtLevel * minSpacing + 40);

            function calculatePositions(node, depth, left, right) {
                if (!node) return;
                // 动态宽度：该层节点数越多，间距越小
                var levelWidth = right - left;
                var nodeCountAtLevel = levelNodeCounts[depth] || 1;
                var spacing = Math.max(minSpacing, levelWidth / (nodeCountAtLevel + 1));
                var x = left + spacing;
                var y = 35 + depth * levelHeight;
                nodePositions[node.path] = {x: x, y: y};

                if (node.left) {
                    calculatePositions(node.left, depth + 1, left, x);
                }
                if (node.right) {
                    calculatePositions(node.right, depth + 1, x, right);
                }
            }

            function getTreeHeight(node) {
                if (!node) return 0;
                var leftH = getTreeHeight(node.left);
                var rightH = getTreeHeight(node.right);
                return 1 + Math.max(leftH, rightH);
            }

            calculatePositions(tree, 0, 20, baseWidth - 20);

            // 设置 viewBox 以确保树完整显示
            var svgWidth = baseWidth;
            var svgHeight = 40 + (maxLevel + 1) * levelHeight + 20;
            svg.setAttribute("viewBox", "0 0 " + svgWidth + " " + svgHeight);

            // 绘制边
            function drawEdges(node) {
                if (!node) return;
                if (node.left) {
                    var parent = nodePositions[node.path];
                    var child = nodePositions[node.left.path];
                    var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", parent.x);
                    line.setAttribute("y1", parent.y + nodeRadius);
                    line.setAttribute("x2", child.x);
                    line.setAttribute("y2", child.y - nodeRadius);
                    line.setAttribute("stroke", "#ccc");
                    line.setAttribute("stroke-width", "2");
                    svg.appendChild(line);
                    drawEdges(node.left);
                }
                if (node.right) {
                    var parent = nodePositions[node.path];
                    var child = nodePositions[node.right.path];
                    var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", parent.x);
                    line.setAttribute("y1", parent.y + nodeRadius);
                    line.setAttribute("x2", child.x);
                    line.setAttribute("y2", child.y - nodeRadius);
                    line.setAttribute("stroke", "#ccc");
                    line.setAttribute("stroke-width", "2");
                    svg.appendChild(line);
                    drawEdges(node.right);
                }
            }

            // 绘制节点
            function drawNode(node) {
                if (!node) return;

                var pos = nodePositions[node.path];
                var g = document.createElementNS("http://www.w3.org/2000/svg", "g");

                // 确定节点样式
                var fillColor = "#fff";
                var strokeColor = "#9e9e9e";
                var strokeWidth = 2;
                var fontWeight = "normal";
                var fontColor = "#333";

                if (node.status === "computing") {
                    fillColor = "#ffebee";
                    strokeColor = "#e53935";
                    strokeWidth = 3;
                } else if (node.status === "returning") {
                    fillColor = "#e3f2fd";
                    strokeColor = "#1976d2";
                    strokeWidth = 3;
                } else if (node.status === "done") {
                    fillColor = "#e8f5e9";
                    strokeColor = "#43a047";
                    strokeWidth = 2;
                }

                // 圆圈
                var circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", pos.x);
                circle.setAttribute("cy", pos.y);
                circle.setAttribute("r", nodeRadius);
                circle.setAttribute("fill", fillColor);
                circle.setAttribute("stroke", strokeColor);
                circle.setAttribute("stroke-width", strokeWidth);
                g.appendChild(circle);

                // 节点标签 (fib(n))
                var label = document.createElementNS("http://www.w3.org/2000/svg", "text");
                label.setAttribute("x", pos.x);
                label.setAttribute("y", pos.y - 4);
                label.setAttribute("text-anchor", "middle");
                label.setAttribute("dominant-baseline", "middle");
                label.setAttribute("font-family", "var(--font-mono, monospace)");
                label.setAttribute("font-size", "11");
                label.setAttribute("fill", "#666");
                label.textContent = "fib(" + node.value + ")";
                g.appendChild(label);

                // 如果有计算结果，显示结果
                if (node.result !== null) {
                    var result = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    result.setAttribute("x", pos.x);
                    result.setAttribute("y", pos.y + 12);
                    result.setAttribute("text-anchor", "middle");
                    result.setAttribute("dominant-baseline", "middle");
                    result.setAttribute("font-family", "var(--font-mono, monospace)");
                    result.setAttribute("font-size", "14");
                    result.setAttribute("font-weight", "bold");
                    result.setAttribute("fill", "#2e7d32");
                    result.textContent = "=" + node.result;
                    g.appendChild(result);
                }

                // 高亮当前活跃节点
                if (state.activePath === node.path && node.status === "computing") {
                    var glow = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    glow.setAttribute("cx", pos.x);
                    glow.setAttribute("cy", pos.y);
                    glow.setAttribute("r", nodeRadius + 4);
                    glow.setAttribute("fill", "none");
                    glow.setAttribute("stroke", "#e53935");
                    glow.setAttribute("stroke-width", 2);
                    glow.setAttribute("stroke-opacity", 0.5);
                    g.insertBefore(glow, circle);
                }

                svg.appendChild(g);

                // 递归绘制子节点
                if (node.left) drawNode(node.left);
                if (node.right) drawNode(node.right);
            }

            drawEdges(tree);
            drawNode(tree);

            container.appendChild(svg);

            // 添加图例
            var legend = document.createElement("div");
            legend.style.cssText = "display:flex;justify-content:center;gap:24px;margin-top:12px;font-size:0.8rem;";
            legend.innerHTML = `
                <div style="display:flex;align-items:center;gap:6px;">
                    <div style="width:14px;height:14px;border-radius:50%;background:#ffebee;border:2px solid #e53935;"></div>
                    <span style="color:#666;">计算中</span>
                </div>
                <div style="display:flex;align-items:center;gap:6px;">
                    <div style="width:14px;height:14px;border-radius:50%;background:#e8f5e9;border:2px solid #43a047;"></div>
                    <span style="color:#666;">已完成</span>
                </div>
                <div style="display:flex;align-items:center;gap:6px;">
                    <div style="width:14px;height:14px;border-radius:50%;background:#e3f2fd;border:2px solid #1976d2;"></div>
                    <span style="color:#666;">返回中</span>
                </div>
            `;
            container.appendChild(legend);
        }

        function renderReverse(state) {
            var container = document.getElementById("visualArea");
            container.innerHTML = "";

            var stack = state.stack || [];

            if (state.phase === "done" || stack.length === 0) {
                if (state.returnValue !== null) {
                    container.innerHTML = '<div class="tree-node">' +
                        '<div style="font-size:1.2rem;font-family:var(--font-mono);color:#2e7d32;font-weight:700;">"' + state.returnValue + '"</div>' +
                        '<div style="margin-top:12px;font-size:0.9rem;color:#666;">递归完成</div>' +
                        '</div>';
                } else {
                    container.innerHTML = '<div style="color:#999;padding:40px;">等待开始...</div>';
                }
                return;
            }

            // 渲染栈帧 - 栈顶在上,栈底在下(倒序遍历)
            var html = '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">';
            html += '<div class="stack-top-label">↑ 栈顶（最新调用）</div>';

            for (var i = stack.length - 1; i >= 0; i--) {
                var call = stack[i];
                var isActive = (i === stack.length - 1);

                html += '<div class="stack-frame ' + (isActive ? 'active' : '') + '">';
                html += '<div class="func-name">reverse</div>';
                html += '<div class="param">"' + call.str + '"</div>';
                html += '</div>';

                if (i > 0) {
                    html += '<div class="stack-arrow">↑</div>';
                }
            }

            html += '<div class="stack-bottom-label">栈底</div>';
            html += '</div>';

            container.innerHTML = html;
        }

        function render(state) {
            var dataDisplay = document.getElementById("dataDisplay");

            if (state.type === "factorial") {
                renderFactorial(state);
                var result = state.returnValue !== null ? " = " + state.returnValue : "";
                dataDisplay.textContent = "factorial(" + state.n + ")" + result;
            } else if (state.type === "fibonacci") {
                renderFibonacci(state);
                if (state.returnValues && state.returnValues["root"] !== undefined) {
                    dataDisplay.textContent = "fibonacci(" + state.n + ") = " + state.returnValues["root"];
                } else {
                    dataDisplay.textContent = "fibonacci(" + state.n + ")";
                }
            } else if (state.type === "reverse") {
                renderReverse(state);
                var result = state.returnValue !== null ? " = \"" + state.returnValue + "\"" : "";
                dataDisplay.textContent = "reverse(\"" + state.s + "\")" + result;
            }

            // 更新步骤信息
            var stepInfo = stepManager.getStepInfo();
            document.getElementById("stepDescription").textContent = stepInfo.description;

            var whyText = document.getElementById("whyText");
            var nextText = document.getElementById("nextText");

            if (stepInfo.why) {
                document.getElementById("whyBox").style.display = "block";
                whyText.textContent = stepInfo.why;
            } else {
                document.getElementById("whyBox").style.display = "none";
            }

            if (stepInfo.next) {
                document.getElementById("nextBox").style.display = "block";
                nextText.textContent = stepInfo.next;
            } else {
                document.getElementById("nextBox").style.display = "none";
            }

            // 更新调用栈显示 - 栈顶在上,栈底在下
            var stackDisplay = document.getElementById("stackDisplay");
            if (state.stack && state.stack.length > 0) {
                var stackItems = state.stack.map(function(item) {
                    if (state.type === "factorial") {
                        return "factorial(" + item + ")";
                    } else if (state.type === "fibonacci") {
                        return "fib(" + item.n + ")";
                    } else if (state.type === "reverse") {
                        return "reverse(\"" + item.str + "\")";
                    }
                    return "";
                });
                // 倒序:栈顶(最后压入的)显示在最上面
                stackItems.reverse();
                stackDisplay.innerHTML =
                    "<span style='color:#999'>↑ 栈顶</span><br>" +
                    stackItems.join("<br>") +
                    "<br><span style='color:#999'>↓ 栈底</span>";
            } else {
                stackDisplay.textContent = "栈为空";
            }
        }

        // ============================================================================
        // 初始化和事件处理
        // ============================================================================

        function init(operation) {
            currentOperation = operation;
            var value = parseInt(document.getElementById("valueInput").value) || 4;

            // 限制输入范围
            if (operation === "fibonacci") {
                value = Math.min(Math.max(value, 1), 8);
            } else {
                value = Math.min(Math.max(value, 1), 10);
            }

            switch (operation) {
                case "factorial":
                    steps = generateFactorialSteps(value);
                    break;
                case "fibonacci":
                    steps = generateFibonacciSteps(value);
                    break;
                case "reverse":
                    var testStr = value <= 4 ? "hello" : (value <= 6 ? "Python" : "recursion");
                    steps = generateReverseSteps(testStr);
                    break;
            }

            stepManager = createStepManager(steps, render);
            stepManager.render();

            updateButtons();
        }

        function updateButtons() {
            var btnPrev = document.getElementById("btnPrev");
            var btnNext = document.getElementById("btnNext");
            var stepIndicator = document.getElementById("stepIndicator");

            if (btnPrev) btnPrev.disabled = !stepManager.hasPrev();
            if (btnNext) btnNext.disabled = !stepManager.hasNext();

            if (stepIndicator && stepManager) {
                var curr = stepManager.getCurrentStep() + 1;
                var total = stepManager.getTotalSteps();
                stepIndicator.textContent = "步骤 " + curr + " / " + total;
            }
        }

        // 页面加载完成后初始化
        window.addEventListener("DOMContentLoaded", function() {
            // 创建按钮
            var buttonRow = document.getElementById("buttonRow");
            buttonRow.innerHTML =
                '<button class="btn btn-secondary" id="btnPrev" disabled>← 上一步</button>' +
                '<span class="step-indicator" id="stepIndicator">步骤 1 / 1</span>' +
                '<button class="btn btn-primary" id="btnNext" disabled>下一步 →</button>' +
                '<button class="btn btn-secondary" id="btnReset">重置</button>';

            // 绑定操作标签
            var opTabs = document.querySelectorAll(".op-tab");
            opTabs.forEach(function(tab) {
                tab.addEventListener("click", function() {
                    opTabs.forEach(function(t) { t.classList.remove("active"); });
                    tab.classList.add("active");
                    init(tab.getAttribute("data-op"));
                });
            });

            // 绑定按钮事件
            document.getElementById("btnPrev").addEventListener("click", function() {
                stepManager.prev();
                updateButtons();
            });

            document.getElementById("btnNext").addEventListener("click", function() {
                stepManager.next();
                updateButtons();
            });

            document.getElementById("btnReset").addEventListener("click", function() {
                init(currentOperation);
            });

            document.getElementById("restartBtn").addEventListener("click", function() {
                init(currentOperation);
            });

            // 初始加载
            var activeTab = document.querySelector(".op-tab.active");
            var initialOp = activeTab ? activeTab.getAttribute("data-op") : "factorial";
            init(initialOp);
        });
    </script>
</body>
