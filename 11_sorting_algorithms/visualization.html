    <script src="../shared/utils.js"></script>
    <script>
        var currentOp = "bubble";
        var steps = [];
        var stepManager = null;
        var originalArr = [64, 34, 25, 12, 22, 11, 90];

        function renderBars(state) {
            var container = document.getElementById("barsContainer");
            var arr = state.arr;
            var activeIdx = state.activeIdx;
            var comparedIdx = state.comparedIdx || [];
            var sortedIdx = state.sortedIdx || [];
            var pivotIdx = state.pivotIdx;
            var currentIdx = state.currentIdx;

            var maxVal = Math.max.apply(null, arr);

            var html = '';
            for (var i = 0; i < arr.length; i++) {
                var height = Math.round((arr[i] / maxVal) * 160);
                var cls = "bar";

                if (sortedIdx.includes(i)) cls += " sorted";
                else if (i === pivotIdx) cls += " pivot";
                else if (i === activeIdx) cls += " active";
                else if (i === currentIdx) cls += " current";
                else if (comparedIdx.includes(i)) cls += " compared";

                html += '<div class="bar-wrapper">';
                html += '<div class="' + cls + '" style="height:' + height + 'px;"></div>';
                html += '<div class="bar-value">' + arr[i] + '</div>';
                html += '<div class="bar-index">[' + i + ']</div>';
                html += '</div>';
            }

            container.innerHTML = html;
        }

        // ==================== 冒泡排序 ====================
        function genBubbleSteps() {
            var s = [];
            var arr = originalArr.slice();
            var n = arr.length;
            var sortedIdx = [];

            s.push({
                state: { arr: arr.slice(), activeIdx: null, comparedIdx: [], sortedIdx: [], pivotIdx: null, currentIdx: null },
                description: "原始数组：" + arr.join(", "),
                why: "冒泡排序：每轮把最大的冒到最后",
                next: "开始第一轮比较"
            });

            for (var i = 0; i < n; i++) {
                for (var j = 0; j < n - i - 1; j++) {
                    s.push({
                        state: { arr: arr.slice(), activeIdx: j, comparedIdx: [j, j+1], sortedIdx: sortedIdx.slice(), pivotIdx: null, currentIdx: null },
                        description: "比较 arr[" + j + "]=" + arr[j] + " 和 arr[" + (j+1) + "]=" + arr[j+1],
                        why: "相邻元素两两比较",
                        next: null
                    });

                    if (arr[j] > arr[j+1]) {
                        s.push({
                            state: { arr: arr.slice(), activeIdx: j, comparedIdx: [j, j+1], sortedIdx: sortedIdx.slice(), pivotIdx: null, currentIdx: null },
                            description: arr[j] + " > " + arr[j+1] + "，交换",
                            why: "把大的往后挪（冒泡）",
                            next: null
                        });

                        var tmp = arr[j]; arr[j] = arr[j+1]; arr[j+1] = tmp;

                        s.push({
                            state: { arr: arr.slice(), activeIdx: null, comparedIdx: [], sortedIdx: sortedIdx.slice(), pivotIdx: null, currentIdx: null },
                            description: "交换后：" + arr.join(", "),
                            why: null,
                            next: null
                        });
                    } else {
                        s.push({
                            state: { arr: arr.slice(), activeIdx: null, comparedIdx: [], sortedIdx: sortedIdx.slice(), pivotIdx: null, currentIdx: null },
                            description: arr[j] + " <= " + arr[j+1] + "，不交换",
                            why: "顺序正确，不需要交换",
                            next: null
                        });
                    }
                }

                sortedIdx.push(n - i - 1);
                s.push({
                    state: { arr: arr.slice(), activeIdx: null, comparedIdx: [], sortedIdx: sortedIdx.slice(), pivotIdx: null, currentIdx: null },
                    description: "第 " + (i+1) + " 轮完成，" + arr[n-i-1] + " 已排序到最后",
                    why: "最大的元素已经冒到最后",
                    next: i < n - 1 ? "开始下一轮" : "完成"
                });
            }

            s.push({
                state: { arr: arr.slice(), activeIdx: null, comparedIdx: [], sortedIdx: Array.from({length: n}, (_, i) => i), pivotIdx: null, currentIdx: null },
                description: "排序完成！" + arr.join(", "),
                why: "所有元素都已排序",
                next: null
            });

            return s;
        }

        // ==================== 选择排序 ====================
        function genSelectionSteps() {
            var s = [];
            var arr = originalArr.slice();
            var n = arr.length;
            var sortedIdx = [];

            s.push({
                state: { arr: arr.slice(), activeIdx: null, comparedIdx: [], sortedIdx: [], pivotIdx: null, currentIdx: null },
                description: "原始数组：" + arr.join(", "),
                why: "选择排序：每轮选择最小的放到已排序末尾",
                next: "开始第一轮"
            });

            for (var i = 0; i < n; i++) {
                var minIdx = i;
                s.push({
                    state: { arr: arr.slice(), activeIdx: i, comparedIdx: [], sortedIdx: sortedIdx.slice(), pivotIdx: null, currentIdx: null },
                    description: "第 " + (i+1) + " 轮：在 " + arr.slice(i).join(", ") + " 中找最小值",
                    why: "假设当前位置是最小的",
                    next: "遍历剩余元素找最小值"
                });

                for (var j = i + 1; j < n; j++) {
                    s.push({
                        state: { arr: arr.slice(), activeIdx: i, comparedIdx: [j], sortedIdx: sortedIdx.slice(), pivotIdx: null, currentIdx: minIdx },
                        description: "比较 arr[" + minIdx + "]=" + arr[minIdx] + " 和 arr[" + j + "]=" + arr[j],
                        why: "更新最小值索引",
                        next: null
                    });

                    if (arr[j] < arr[minIdx]) {
                        minIdx = j;
                        s.push({
                            state: { arr: arr.slice(), activeIdx: i, comparedIdx: [], sortedIdx: sortedIdx.slice(), pivotIdx: null, currentIdx: minIdx },
                            description: "更新最小值索引为 " + minIdx,
                            why: "找到更小的元素",
                            next: null
                        });
                    }
                }

                if (minIdx !== i) {
                    s.push({
                        state: { arr: arr.slice(), activeIdx: i, comparedIdx: [minIdx], sortedIdx: sortedIdx.slice(), pivotIdx: null, currentIdx: null },
                        description: "交换 arr[" + i + "]=" + arr[i] + " 和 arr[" + minIdx + "]=" + arr[minIdx],
                        why: "把最小值换到位置 " + i,
                        next: null
                    });

                    var tmp = arr[i]; arr[i] = arr[minIdx]; arr[minIdx] = tmp;
                }

                sortedIdx.push(i);
                s.push({
                    state: { arr: arr.slice(), activeIdx: null, comparedIdx: [], sortedIdx: sortedIdx.slice(), pivotIdx: null, currentIdx: null },
                    description: "位置 " + i + " 已排序：" + arr[i],
                    why: null,
                    next: i < n - 1 ? "继续下一轮" : "完成"
                });
            }

            s.push({
                state: { arr: arr.slice(), activeIdx: null, comparedIdx: [], sortedIdx: Array.from({length: n}, (_, i) => i), pivotIdx: null, currentIdx: null },
                description: "排序完成！" + arr.join(", "),
                why: "所有位置都已排序",
                next: null
            });

            return s;
        }

        // ==================== 插入排序 ====================
        function genInsertionSteps() {
            var s = [];
            var arr = originalArr.slice();
            var n = arr.length;

            s.push({
                state: { arr: arr.slice(), activeIdx: null, comparedIdx: [], sortedIdx: [0], pivotIdx: null, currentIdx: null },
                description: "原始数组：" + arr.join(", ") + "。插入排序：从第二张牌开始，每次插入到已排序部分的正确位置",
                why: "假设第一张牌已排序",
                next: "开始插入"
            });

            for (var i = 1; i < n; i++) {
                var key = arr[i];
                var j = i - 1;

                s.push({
                    state: { arr: arr.slice(), activeIdx: i, comparedIdx: [], sortedIdx: Array.from({length: i}, (_, k) => k), pivotIdx: null, currentIdx: null },
                    description: "插入 " + key + " 到已排序部分 " + arr.slice(0, i).join(", "),
                    why: "把 key 和已排序部分从后往前比较",
                    next: null
                });

                while (j >= 0 && arr[j] > key) {
                    s.push({
                        state: { arr: arr.slice(), activeIdx: i, comparedIdx: [j], sortedIdx: Array.from({length: i}, (_, k) => k), pivotIdx: null, currentIdx: null },
                        description: "arr[" + j + "]=" + arr[j] + " > " + key + "，往后移",
                        why: "比 key 大的元素往后挪一位",
                        next: null
                    });

                    arr[j+1] = arr[j];
                    j--;
                }

                arr[j+1] = key;

                s.push({
                    state: { arr: arr.slice(), activeIdx: null, comparedIdx: [], sortedIdx: Array.from({length: i+1}, (_, k) => k), pivotIdx: null, currentIdx: null },
                    description: "把 " + key + " 放到位置 " + (j+1) + "。已排序：" + arr.slice(0, i+1).join(", "),
                    why: "找到插入位置，放入 key",
                    next: i < n - 1 ? "继续插入下一个" : "完成"
                });
            }

            s.push({
                state: { arr: arr.slice(), activeIdx: null, comparedIdx: [], sortedIdx: Array.from({length: n}, (_, i) => i), pivotIdx: null, currentIdx: null },
                description: "排序完成！" + arr.join(", "),
                why: null,
                next: null
            });

            return s;
        }

        // ==================== 归并排序 ====================
        function genMergeSteps() {
            var s = [];
            var arr = originalArr.slice();
            var n = arr.length;

            s.push({
                state: { arr: arr.slice(), activeIdx: null, comparedIdx: [], sortedIdx: [], pivotIdx: null, currentIdx: null, phase: "start" },
                description: "原始数组：" + arr.join(", "),
                why: "归并排序：分而治之。先分割，再合并",
                next: "开始分割"
            });

            function merge_sort(arr2, left, right) {
                if (left >= right) return;

                var mid = Math.floor((left + right) / 2);

                s.push({
                    state: { arr: arr.slice(), activeIdx: null, comparedIdx: [], sortedIdx: [], pivotIdx: null, currentIdx: null, highlightRange: [left, mid, right] },
                    description: "分割：[" + left + ".." + mid + "] 和 [" + (mid+1) + ".." + right + "]",
                    why: "把数组分成两半",
                    next: "递归处理左半部分"
                });

                merge_sort(arr2, left, mid);
                merge_sort(arr2, mid + 1, right);

                // 合并
                var temp = [];
                var i2 = left, j = mid + 1;

                s.push({
                    state: { arr: arr.slice(), activeIdx: null, comparedIdx: [], sortedIdx: [], pivotIdx: null, currentIdx: null },
                    description: "合并 [" + left + ".." + mid + "] 和 [" + (mid+1) + ".." + right + "]",
                    why: "将两个有序数组合并成一个有序数组",
                    next: null
                });

                while (i2 <= mid && j <= right) {
                    if (arr2[i2] <= arr2[j]) {
                        temp.push(arr2[i2]);
                        i2++;
                    } else {
                        temp.push(arr2[j]);
                        j++;
                    }
                }

                while (i2 <= mid) { temp.push(arr2[i2]); i2++; }
                while (j <= right) { temp.push(arr2[j]); j++; }

                for (var k = 0; k < temp.length; k++) {
                    arr2[left + k] = temp[k];
                }

                s.push({
                    state: { arr: arr2.slice(), activeIdx: null, comparedIdx: [], sortedIdx: [], pivotIdx: null, currentIdx: null },
                    description: "合并结果：" + arr2.slice(left, right+1).join(", "),
                    why: null,
                    next: null
                });
            }

            merge_sort(arr, 0, n - 1);

            s.push({
                state: { arr: arr.slice(), activeIdx: null, comparedIdx: [], sortedIdx: Array.from({length: n}, (_, i) => i), pivotIdx: null, currentIdx: null },
                description: "排序完成！" + arr.join(", "),
                why: null,
                next: null
            });

            return s;
        }

        // ==================== 快速排序 ====================
        function genQuickSteps() {
            var s = [];
            var arr = originalArr.slice();
            var n = arr.length;

            s.push({
                state: { arr: arr.slice(), activeIdx: null, comparedIdx: [], sortedIdx: [], pivotIdx: null, currentIdx: null },
                description: "原始数组：" + arr.join(", "),
                why: "快速排序：选基准，分两边，递归排序",
                next: "开始排序"
            });

            function quick_sort(arr2, low, high) {
                if (low >= high) return;

                var pivot = arr2[low];
                s.push({
                    state: { arr: arr2.slice(), activeIdx: null, comparedIdx: [], sortedIdx: [], pivotIdx: low, currentIdx: null },
                    description: "基准=" + pivot + "（位置 " + low + "）",
                    why: "选第一个元素作为基准",
                    next: "把小于基准的放左边，大于基准的放右边"
                });

                var i = low, j = high;
                while (i < j) {
                    while (i < j && arr2[j] >= pivot) {
                        s.push({
                            state: { arr: arr2.slice(), activeIdx: null, comparedIdx: [j], sortedIdx: [], pivotIdx: low, currentIdx: null },
                            description: "从右往左找：arr[" + j + "]=" + arr2[j] + " >= " + pivot,
                            why: "找比基准小的元素",
                            next: null
                        });
                        j--;
                    }
                    if (i < j) {
                        arr2[i] = arr2[j];
                        s.push({
                            state: { arr: arr2.slice(), activeIdx: i, comparedIdx: [], sortedIdx: [], pivotIdx: low, currentIdx: null },
                            description: "把 " + arr2[j] + " 移到左边",
                            why: "arr[" + j + "] < 基准，移到左边",
                            next: null
                        });
                        i++;
                    }

                    while (i < j && arr2[i] < pivot) {
                        s.push({
                            state: { arr: arr2.slice(), activeIdx: null, comparedIdx: [i], sortedIdx: [], pivotIdx: low, currentIdx: null },
                            description: "从左往右找：arr[" + i + "]=" + arr2[i] + " < " + pivot,
                            why: "找比基准大的元素",
                            next: null
                        });
                        i++;
                    }
                    if (i < j) {
                        arr2[j] = arr2[i];
                        s.push({
                            state: { arr: arr2.slice(), activeIdx: j, comparedIdx: [], sortedIdx: [], pivotIdx: low, currentIdx: null },
                            description: "把 " + arr2[i] + " 移到右边",
                            why: "arr[" + i + "] >= 基准，移到右边",
                            next: null
                        });
                        j--;
                    }
                }

                arr2[i] = pivot;

                s.push({
                    state: { arr: arr2.slice(), activeIdx: null, comparedIdx: [], sortedIdx: [], pivotIdx: i, currentIdx: null },
                    description: "基准 " + pivot + " 放到位置 " + i + "。左边的都小于它，右边的都大于它",
                    why: "分隔完成，基准在正确位置",
                    next: null
                });

                quick_sort(arr2, low, i - 1);
                quick_sort(arr2, i + 1, high);
            }

            quick_sort(arr, 0, n - 1);

            s.push({
                state: { arr: arr.slice(), activeIdx: null, comparedIdx: [], sortedIdx: Array.from({length: n}, (_, i) => i), pivotIdx: null, currentIdx: null },
                description: "排序完成！" + arr.join(", "),
                why: null,
                next: null
            });

            return s;
        }

        function render(state) {
            renderBars(state);

            var resultEl = document.getElementById("resultValue");
            resultEl.textContent = "数组：" + (state.arr || originalArr).join(", ");

            var stepInfo = stepManager.getStepInfo();
            document.getElementById("stepDescription").textContent = stepInfo.description || "";

            if (stepInfo.why) {
                document.getElementById("whyBox").style.display = "block";
                document.getElementById("whyText").textContent = stepInfo.why;
            } else {
                document.getElementById("whyBox").style.display = "none";
            }

            if (stepInfo.next) {
                document.getElementById("nextBox").style.display = "block";
                document.getElementById("nextText").textContent = stepInfo.next;
            } else {
                document.getElementById("nextBox").style.display = "none";
            }

            updateButtons();
        }

        function updateButtons() {
            var btnPrev = document.getElementById("btnPrev");
            var btnNext = document.getElementById("btnNext");
            var stepIndicator = document.getElementById("stepIndicator");
            if (btnPrev) btnPrev.disabled = !stepManager.hasPrev();
            if (btnNext) btnNext.disabled = !stepManager.hasNext();
            if (stepIndicator && stepManager) {
                stepIndicator.textContent = "步骤 " + (stepManager.getCurrentStep() + 1) + " / " + stepManager.getTotalSteps();
            }
        }

        function init(op) {
            currentOp = op;
            if (op === "bubble") {
                steps = genBubbleSteps();
                document.getElementById("barsContainer").style.display = "flex";
                document.getElementById("heapIntro").style.display = "none";
            }
            else if (op === "selection") {
                steps = genSelectionSteps();
                document.getElementById("barsContainer").style.display = "flex";
                document.getElementById("heapIntro").style.display = "none";
            }
            else if (op === "insertion") {
                steps = genInsertionSteps();
                document.getElementById("barsContainer").style.display = "flex";
                document.getElementById("heapIntro").style.display = "none";
            }
            else if (op === "merge") {
                steps = genMergeSteps();
                document.getElementById("barsContainer").style.display = "flex";
                document.getElementById("heapIntro").style.display = "none";
            }
            else if (op === "quick") {
                steps = genQuickSteps();
                document.getElementById("barsContainer").style.display = "flex";
                document.getElementById("heapIntro").style.display = "none";
            }
            stepManager = createStepManager(steps, render);
            stepManager.render();
            updateButtons();
        }

        window.addEventListener("DOMContentLoaded", function() {
            var buttonRow = document.getElementById("buttonRow");
            buttonRow.innerHTML =
                '<button class="btn btn-secondary" id="btnPrev" disabled>← 上一步</button>' +
                '<span class="step-indicator" id="stepIndicator">步骤 1 / 1</span>' +
                '<button class="btn btn-primary" id="btnNext" disabled>下一步 →</button>' +
                '<button class="btn btn-secondary" id="btnReset">重置</button>';

            var opTabs = document.querySelectorAll(".op-tab");
            opTabs.forEach(function(tab) {
                tab.addEventListener("click", function() {
                    opTabs.forEach(function(t) { t.classList.remove("active"); });
                    tab.classList.add("active");
                    init(tab.getAttribute("data-op"));
                });
            });

            document.getElementById("goBtn").addEventListener("click", function() {
                init(currentOp);
            });

            document.getElementById("btnPrev").addEventListener("click", function() { stepManager.prev(); updateButtons(); });
            document.getElementById("btnNext").addEventListener("click", function() { stepManager.next(); updateButtons(); });
            document.getElementById("btnReset").addEventListener("click", function() { init(currentOp); });

            // 初始化显示
            var state = { arr: originalArr.slice(), activeIdx: null, comparedIdx: [], sortedIdx: [], pivotIdx: null, currentIdx: null };
            renderBars(state);
        });
    </script>
</body>
</html>
